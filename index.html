  const setM=(el,m)=>{ const s=el&&el.querySelector('svg.hxa'); if(!s) return; MOOD.forEach(x=>s.classList.remove('mo-'+x)); s.classList.add('mo-'+m); };
  const box=()=>document.getElementById('lhxMsgs');
  const add=html=>{ const b=box(); if(!b) return null; const d=document.createElement('div'); d.className='lhx-new'; d.innerHTML=html; b.appendChild(d); while(b.children.length>4) b.removeChild(b.firstElementChild); return d; };
  const ai=(inner,m='idle')=>`<div class="lhx-ai">${hxOrb(26,m)}<div class="lhx-card">${inner}</div></div>`;
  const me=t=>`<div class="lhx-me">${t}</div>`;
  const chips=a=>`<div class="lhx-chips">${a.map(([k,v])=>`<span><b>${k}</b> ${v}</span>`).join('')}</div>`;
  const logCard=(what,when,from,to)=>`<div class="lhx-log"><div class="hd">Update your daily log?</div><div class="rw"><b>${what}</b><span>${when} · ${from} h → <b>${to} h</b></span></div><div class="btns"><span class="p">Confirm</span><span>Edit</span><span>Cancel</span></div></div>`;
  const saved=t=>`<div class="lhx-log"><div class="hd ok">✓ Saved to your daily log</div><div class="rw"><span>${t} · via Helios</span></div></div>`;
  // numbers come from the same calculator as the app, for the sample family (Maria)
  function nums(){ const keep={apps:S.apps,bill:S.bill,billConfirmed:S.billConfirmed,checked:S.checked,checkSig:S.checkSig,checkLow:S.checkLow,fresh:S.fresh};
    try{ if(S.fresh||!S.checked){ Object.assign(S,{apps:clone(SAMPLE.apps),bill:clone(SAMPLE.bill),billConfirmed:true,checked:true,checkLow:false,fresh:false}); S.checkSig=appSig(); }
      const h=H(), r=h.sz.rec;
      const d0=TODAY.slice(0,8)+'01'; let sum=0,n=0; for(let k=1;k<32;k++){ const key=dShift(k); if(key<d0) break; const v=dayKwh(key); if(v!=null){ sum+=v; n++; } }
      const avg=n?sum/n:(h.Eday??h.Eyear/365), mon=new Date(TODAY+'T00:00').toLocaleString('en',{month:'short'});
      return {mon,mkwh:fmt.n(Math.round(sum)),mpeso:fmt.n(Math.round(sum*K.R_RETAIL)),mdays:n,avg:avg.toFixed(1),fc:fmt.n(Math.round(avg*30*K.R_RETAIL/10)*10),N:r.N,kwp:r.kwp.toFixed(2),pb:r.pb.toFixed(1),cov:(r.cov*100).toFixed(0),gen:fmt.n(Math.round(r.gen)),s1:fmt.n(Math.round(r.s1/100)*100),use:fmt.n(Math.round(h.Eyear))};
    }catch(e){ return {mon:'Oct',mkwh:'75',mpeso:'1,111',mdays:5,avg:'15.0',fc:'6,670',N:6,kwp:'3.30',pb:'3.1',cov:'89',gen:'4,612',s1:'56,500',use:'5,183'}; } finally{ Object.assign(S,keep); } }
  let run=0, visible=false, scene=0, V=null;
  const wait=ms=>new Promise(r=>setTimeout(r,ms));
  async function type(txt,id){ const el=document.getElementById('lhxIn'); if(!el) return false; el.classList.add('typing'); mood('listening');
    for(let i=1;i<=txt.length;i++){ if(run!==id||!document.getElementById('lhxIn')) return false; el.textContent=txt.slice(0,i); await wait(32); }
    await wait(220); el.textContent=''; el.classList.remove('typing'); return true; }
  async function stream(el,html,id){ const words=html.split(/(\s+)/); for(let i=1;i<=words.length;i+=2){ if(run!==id) return false; el.innerHTML=words.slice(0,i).join(''); await wait(38); } el.innerHTML=html; return true; }
  async function ask(q,id){ if(!await type(q,id)) return null; add(me(q)); return true; }
  async function think(steps,id,ms=1100){ mood('thinking'); const t=add(ai(`<div class="lhx-steps">${steps.map(s=>`<span><i></i>${s}</span>`).join('')}</div>`,'thinking')); await wait(ms); if(t) t.remove(); return run===id; }
  async function answer(html,extra,id,m='idle'){ mood('talking'); const a=add(ai('<span class="tx"></span>','talking')); if(!a) return null; if(!await stream(a.querySelector('.tx'),html,id)) return null;
    if(extra) a.querySelector('.tx').insertAdjacentHTML('afterend',extra); setM(a,m); mood(m); return a; }
  async function confirm(card,done,id){ const lg=add(ai(card)); await wait(1000); if(run!==id||!lg) return false; const p=lg.querySelector('.p'); p.classList.add('press'); await wait(260);
    lg.querySelector('.lhx-card').innerHTML=done; setM(lg,'happy'); mood('happy'); await wait(1500); return run===id; }
  const SC=[
    async id=>{ // Hi: a friendly hello
      if(!await ask('Hi Helios!',id)) return; mood('happy'); await wait(450); if(run!==id) return;
      await answer('Hi Maria! I\'m <span class="hl">Helios</span>, your energy guide. I know your bill, your appliances and your solar plan. Ask me anything, or tell me what you used today.','',id,'happy'); await wait(1500); },
    async id=>{ // This month: use so far, then the expected bill
      if(!await ask(`How much have I used since ${V.mon} 1?`,id)||!await think(['Reading your daily log'],id,900)) return;
      if(!await answer(`Since ${V.mon} 1 you've used <span class="hl">${V.mkwh} kWh</span>, about <span class="hl">₱${V.mpeso}</span>, over ${V.mdays} logged days. That's ${V.avg} kWh a day.`,chips([['Daily log',`${V.mdays} days`],['Rate','₱14.7424/kWh']]),id)) return;
      await wait(1300); if(!await ask("What's my expected bill this month?",id)||!await think(['Calculating your forecast'],id,900)) return;
      await answer(`About <span class="hl">₱${V.fc}</span>. I take your ${V.avg} kWh a day so far, stretch it to 30 days and multiply by ₱14.7424/kWh. It's a guide, not your bill.`,chips([['Forecast',`≈ ₱${V.fc}`]]),id); },
    async id=>{ // 1 Bill: explain + log by chat
      if(!await ask('Why is my bill high?',id)||!await think(['Reading your bill','Checking your appliances'],id)) return;
      if(!await answer('Your aircon is the main reason. Cooling is <span class="hl">68.8%</span> of your estimated use. At <span class="hl">₱14.7424/kWh</span>, every hour you cut saves money right away.',chips([['Your bill','426 kWh'],['Rate','₱14.7424/kWh']]),id)) return;
      await wait(1300); if(!await ask('no aircon today',id)) return; mood('idle');
      await confirm(logCard('Aircon 1.0 HP','today',8,0),saved('Aircon 1.0 HP: 0 h today'),id); },
    async id=>{ // 2 Solar: answer, then Explain simpler
      if(!await ask(`Is ${V.N} panels enough?`,id)||!await think(['Checking your solar plan','Calculating coverage'],id)) return;
      const a=await answer(`${V.N} panels (<span class="hl">${V.kwp} kWp</span>) make about ${V.gen} kWh a year, which covers <span class="hl">${V.cov}%</span> of your use. One more panel would mostly make surplus, which Meralco credits at only ₱9.7032/kWh.`,chips([['Solar plan',`${V.kwp} kWp`],['Yearly use',`${V.use} kWh`]])+'<div class="lhx-tools"><span class="ex">Explain simpler</span></div>',id); if(!a) return;
      await wait(1400); if(run!==id) return; const ex=a.querySelector('.ex'); ex.classList.add('press'); await wait(300);
      await answer(`In short: yes. ${V.N} panels cover about <span class="hl">9 of every 10 kWh</span> your home uses. More panels would earn less, so ${V.N} is the sweet spot.`,'',id,'happy'); },
    async id=>{ // 3 Filipino
      if(!await ask('Sulit ba ang solar sa amin?',id)||!await think(['Tinitingnan ang solar plan mo'],id,900)) return;
      if(!await answer(`Oo, sulit. Ang ${V.N} na panel (<span class="hl">${V.kwp} kWp</span>) ay babayaran ang sarili nito sa mga <span class="hl">${V.pb} taon</span>, at makakatipid kayo ng mga <span class="hl">₱${V.s1}</span> sa unang taon.`,chips([['Solar plan',`${V.kwp} kWp`],['Payback',`${V.pb} taon`]]),id,'happy')) return;
      await wait(1500); if(!await ask('English please',id)) return; mood('thinking'); await wait(600); if(run!==id) return;
      await answer(`Sure! In short: yes, it's worth it. ${V.N} panels pay for themselves in about <span class="hl">${V.pb} years</span> and save about <span class="hl">₱${V.s1}</span> in the first year. I'll keep answering in English.`,'',id,'happy'); },
    async id=>{ // 4 Smart log: Taglish, asks for the missing hours, logs yesterday
      if(!await ask('naka-aircon kami kagabi',id)) return; mood('thinking'); await wait(700); if(run!==id) return;
      if(!await answer('Ilang oras naka-on ang aircon kagabi? Halimbawa “3 hours”, o “wala”.','',id)) return;
      await wait(900); if(!await ask('mga 5 hours',id)) return; mood('idle');
      await confirm(logCard('Aircon 1.0 HP','yesterday',8,5),saved('Aircon 1.0 HP: 5 h yesterday'),id); },
    async id=>{ // 5 Limits: off-topic questions, a future date, then something outside its job
      if(!await ask('what is 10 + 10?',id)) return; mood('thinking'); await wait(600); if(run!==id) return;
      if(!await answer('I can only help with your electricity and solar in Silangan, so no math homework from me. Try “Why is my bill high?”','',id,'oops')) return;
      await wait(1300); if(!await ask("what's the recipe for adobo?",id)) return; mood('thinking'); await wait(600); if(run!==id) return;
      if(!await answer('Recipes are outside what I do. But if you cooked it on the induction stove, tell me how long and I\'ll log it.','',id,'oops')) return;
      await wait(1300); if(!await ask('log aircon 6 hours tomorrow',id)) return;
      if(!await answer('I can only log <span class="hl">today or the past 7 days</span>, not future days.','',id,'oops')) return;
      await wait(1500); if(!await ask('change my bill to 300 kWh',id)) return;
      await answer('I can only update your daily log. You can change your bill in <span class="hl">My electricity → Bill check</span>.','',id,'oops'); },
    async id=>{ // More: what else Helios can do
      if(!await ask('Hi Helios, what else can you do?',id)) return; mood('thinking'); await wait(600); if(run!==id) return;
      await answer('Two things. I <b>explain</b> any number in Silangan in plain words, using only your own results, including “what if” changes like an inverter aircon. And I <b>log your day</b> when you tell me what you used. Write in English, Filipino or Taglish, and I answer the same way. Try me in the demo below!','',id,'happy'); await wait(1500); }
  ];
  const tabs=i=>document.querySelectorAll('.lhx-tabs [data-lhx]').forEach(b=>{ const on=+b.dataset.lhx===i; b.classList.toggle('on',on); b.setAttribute('aria-selected',on); });
  async function play(id,start){ scene=start;
    while(run===id&&box()&&visible){ tabs(scene); box().innerHTML=''; mood('idle'); await wait(450); if(run!==id) return;
      await SC[scene](id); if(run!==id) return; await wait(1800); if(run!==id) return; mood('idle'); scene=(scene+1)%SC.length; } }
  const STILL=[me('Hi Helios!')+ai('Hi Maria! I\'m <span class="hl">Helios</span>, your energy guide. Ask me anything, or tell me what you used today.','happy'),
    ()=>me(`How much have I used since ${V.mon} 1?`)+ai(`<span class="hl">${V.mkwh} kWh</span>, about ₱${V.mpeso}, over ${V.mdays} logged days.`)+me("What's my expected bill this month?")+ai(`About <span class="hl">₱${V.fc}</span>. It's a guide, not your bill.`),
    me('Why is my bill high?')+ai('Your aircon is the main reason. Cooling is <span class="hl">68.8%</span> of your estimated use.'),
    ()=>me(`Is ${V.N} panels enough?`)+ai(`${V.N} panels (<span class="hl">${V.kwp} kWp</span>) cover <span class="hl">${V.cov}%</span> of your yearly use.`),
    ()=>me('Sulit ba ang solar sa amin?')+ai(`Oo, sulit. Babayaran ang sarili nito sa mga <span class="hl">${V.pb} taon</span>.`)+me('English please')+ai(`Sure! It pays for itself in about <span class="hl">${V.pb} years</span>.`,'happy'),
    me('naka-aircon kami kagabi')+ai('Ilang oras naka-on ang aircon kagabi?')+me('mga 5 hours')+ai(saved('Aircon 1.0 HP: 5 h yesterday'),'happy'),
    me('what is 10 + 10?')+ai('I can only help with your electricity and solar in Silangan.','oops')+me("what's the recipe for adobo?")+ai('Recipes are outside what I do.','oops')+me('change my bill to 300 kWh')+ai('I can only update your daily log. You can change your bill in <span class="hl">My electricity → Bill check</span>.','oops'),
    me('Hi Helios, what else can you do?')+ai('I <b>explain</b> any number in Silangan and <b>log your day</b> by chat, in the language you write in.','happy')];
  function still(i){ const b=box(); if(!b) return; tabs(i); const x=STILL[i]; b.innerHTML=typeof x==='function'?x():x; }
  const reduce=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
  const io=('IntersectionObserver' in window)?new IntersectionObserver(es=>es.forEach(e=>{ visible=e.isIntersecting;
    if(visible&&!reduce()){ const id=++run; play(id,scene); } else if(!visible){ run++; } }),{threshold:.3}):null;
  function watch(){ const s=document.getElementById('helios'); if(!s||s.dataset.lhx) return; s.dataset.lhx='1'; V=nums();
    s.querySelectorAll('.lhx-tabs [data-lhx]').forEach(b=>b.addEventListener('click',()=>{ const i=+b.dataset.lhx; if(reduce()||!io){ still(i); return; } scene=i; const id=++run; visible=true; play(id,i); }));
    if(reduce()||!io){ still(0); return; } io.observe(s);
    const hero=document.getElementById('lhxHero'); hero.addEventListener('mouseenter',()=>{ const sv=hero.querySelector('svg.hxa'); if(!sv) return; const was=[...sv.classList].find(c=>c.startsWith('mo-')); mood('happy'); setTimeout(()=>{ if(sv.classList.contains('mo-happy')&&was) mood(was.slice(3)); },1300); }); }
  render=(f=>function(){ run++; if(io) io.disconnect(); const out=f.apply(this,arguments); watch(); return out; })(render);
  if(S.route==='landing') render(); else watch();
})();

/* ---------- Helios answers in the language you write in (no language buttons) ---------- */
(()=>{
  const FILW=/\b(ang|ng|mga|ba|ko|mo|namin|amin|natin|kami|ako|bakit|paano|magkano|ilan|ilang|sulit|mahal|po|lang|yung|kasi|naman|ito|ano|kung|hindi|wala|meron|sapat|ngayon|ngayong|kagabi|kahapon|tipid|babayaran|buwan|taon|nagamit)\b/gi;
  const isFil=q=>{ const n=(q.match(FILW)||[]).length, w=q.trim().split(/\s+/).length; return n>=2||(n>=1&&w<=3); };
  const askEN=q=>/\b(in|sa|use|speak|answer|reply|talk)\b[^.?!]*\benglish\b|\benglish\s*(please|pls|na lang|lang|po)\b|^\s*english\s*[?!.]*\s*$/i.test(q);
  const askFIL=q=>/\b(in|sa|use|speak|answer|reply|talk)\b[^.?!]*\b(tagalog|filipino)\b|\b(tagalog|filipino)\s*(please|pls|na lang|lang|po)\b|mag-?tagalog/i.test(q);
  /* questions outside Helios's job: math, recipes, trivia, homework, jokes */
  const OFF=/\d+\s*[-+*×x÷\/]\s*\d+|recipe|adobo|sinigang|luto|cook(?!ed)|joke|biro|song|kanta|homework|assignment|essay|poem|tula|who is|sino si|president|pangulo|basketball|movie|pelikula|capital of/i;
  const langOf=q=>S.hxLangX||(isFil(q)?'FIL':'EN');
  delete S.hxLang;

  /* the same numbers, said in Filipino (Taglish-friendly) */
  const cites=t=>t.match(/<span class="cite">[\s\S]*?<\/span>/g)||[];
  const FIL=[
    [/^Your aircon is the main reason/,(c)=>`Ang aircon ang pangunahing dahilan. Ang pagpapalamig ay ${c[0].replace("cooling ","")} ng tantiyang konsumo mo. Sa ${c[1]}, bawat oras na mabawas mo dito ay tipid agad.`],
    [/^(\d+) panels \(/,(c,m)=>`Ang ${m[1]} na panel (${c[0]}) ay gagawa ng mga ${c[1]}, sapat sa ${c[2]} ng konsumo mo sa isang taon. Kung magdadagdag pa ng isa, halos puro sobra na ang magagawa nito, at ${c[3]} lang ang credit ng Meralco diyan.`],
    [/^Switching both aircons/,(c)=>`Kung gagawin mong inverter ang dalawang aircon, makakatipid ka ng mga ${c[0]}, katumbas ng ${c[1]}. Sa ${c[2]} para sa dalawang unit, mababawi mo ito sa mga 5 taon, at puwedeng lumiit ang solar na kailangan mo.`],
    [/^Solar you use yourself/,(c)=>`Ang solar na ginagamit mo mismo ay tipid na buong ${c[0]}. Ang sobra ay napupunta sa Meralco at may credit na ${c[1]}. Ang hindi nagamit na credit ay nadadala sa susunod na bill.`],
    [/^I take your average so far/,(c)=>`Kinukuha ko ang average mo ngayong buwan, ${c[0]}, ginagawang 30 araw, tapos minu-multiply sa ${c[1]}. Lalabas na mga ${c[2]}. Gabay lang ito, hindi pa ang totoong bill mo.`],
    [/^I can only answer from your Silangan results/,(c,m,q)=>c.length>=2
      ? (/sulit|worth/i.test(q)?`Oo, sulit para sa inyo. Ang ${c[0]} na sistema ay babayaran ang sarili nito sa mga ${c[1]}.`:`Mula lang sa mga resulta mo sa Silangan ako sumasagot. Sa ngayon, ang mungkahing sistema mo ay ${c[0]} na mababawi sa mga ${c[1]}. Subukan ang isa sa mga mungkahi.`)
      : `Mula lang sa mga resulta mo sa Silangan ako sumasagot, at wala pang sukat ang solar mo. Tapusin muna ang bill check.`],
  ];

  hxAnswer=(f=>function(q){
    if(askEN(q)){ S.hxLangX='EN'; return {t:`Sure. I'll answer in English for the rest of this chat.`,used:[],act:[]}; }
    if(askFIL(q)){ S.hxLangX='FIL'; return {t:`Sige! Sa Filipino na ako sasagot hanggang matapos ang chat na ito.`,used:[],act:[]}; }
    if(OFF.test(q)) return langOf(q)==='FIL'
      ? {t:`Hindi ko 'yan sakop. Ang kaya ko lang ay ipaliwanag ang mga numero mo sa Silangan (bill, appliances at solar plan) at i-log ang araw mo. Subukan ang “Bakit mataas ang bill ko?”`,used:[],act:[]}
      : {t:`I can only help with your electricity and solar in Silangan: explaining your bill, appliances and solar plan, and logging your day. That question is outside what I do. Try “Why is my bill high?”`,used:[],act:[]};
    const q2=/expected|this month|ngayong buwan|babayaran|magkano.*bill/i.test(q)?'forecast':q;
    const a=f(q2); if(langOf(q)!=='FIL'||!a||!a.t) return a;
    for(const [re,fn] of FIL){ const m=a.t.match(re); if(m){ const c=cites(a.t); return {...a,t:fn(c,m,q)}; } }
    return a; })(hxAnswer);
  hxSteps=(f=>function(q){
    if(askEN(q)||askFIL(q)||OFF.test(q)) return [];
    const st=f(/expected|this month|ngayong buwan|babayaran|magkano.*bill/i.test(q)?'forecast':q);
    return langOf(q)==='FIL'?st.map((s,i)=>i?'Kinukuwenta':'Tinitingnan ang data mo'):st; })(hxSteps);

  /* no language buttons; a new chat goes back to matching how you write */
  VIEWS.ai=(f=>function(){ return f().replace(/<div class="seg sm hxlang"[\s\S]*?<\/div>/,'')
    .replace('<p class="xs faint hxdisc">AI answers can be wrong.','<p class="xs faint hxdisc">Helios answers in the language you write in. AI answers can be wrong.'); })(VIEWS.ai);
  const _new=ACT.hxNew, _open=ACT.hxOpen;
  ACT.hxNew=()=>{ S.hxLangX=null; _new(); };
  ACT.hxOpen=id=>{ S.hxLangX=null; _open(id); };
  delete ACT.hxLang;
  /* asking for a language is free, like logs */
  chatAsk=(f=>function(q){ if((askEN(q)||askFIL(q))&&S.hxUsed>0) S.hxUsed--; return f(q); })(chatAsk);
})();

</script>
