.su-lg{display:flex;flex-direction:column;gap:8px;min-width:0}
.su-lg p{margin:0}
.su-lghd{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--amber);text-transform:none}
.su-lghd.ok{color:var(--volt)}
.su-lgrow{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;padding:10px 12px;border:1px solid var(--hairline-2);border-radius:12px;background:rgba(255,159,28,.06)}
.su-lgrow b{flex:1 1 100%;font-size:14px}
.su-lgrow .num{margin-left:auto}
.su-lgbtn{gap:6px;flex-wrap:wrap}
.su-via{display:flex;align-items:center;gap:10px;padding:10px 14px;margin-bottom:14px;border-radius:12px;border:1px solid rgba(255,159,28,.35);background:rgba(255,159,28,.08);font-size:13px}

/* ===== Motion layer (2026-10-11): scroll reveals, count-ups, step line, glow, onboarding transitions ===== */
:root{--mv-ease:cubic-bezier(.16,1,.3,1);--mv-dur:.9s}
/* scroll progress line and moving sun glow on the landing page */
.mv-progress{position:fixed;left:0;top:0;height:2px;width:100%;transform-origin:0 50%;transform:scaleX(var(--sp,0));background:linear-gradient(90deg,#FFC83D,#FF9F1C 45%,#FF5A1F);z-index:60;pointer-events:none;box-shadow:0 0 12px rgba(255,159,28,.6)}
.mv-sky{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:calc(.10 + var(--sp,0)*.22);background:radial-gradient(60vmax 40vmax at calc(78% - var(--sp,0)*30%) calc(110% - var(--sp,0)*95%),rgba(255,176,60,.55),rgba(255,120,40,.12) 45%,transparent 70%);transition:opacity .4s}
body:not(.mv-landing) .mv-progress,body:not(.mv-landing) .mv-sky{display:none}
#app .lsec,#app .su-cta,#app .su-foot{position:relative;z-index:1}

/* reveal: rise, de-blur, fade */
.mv{opacity:0;transform:translate3d(0,34px,0) scale(.985);filter:blur(8px);transition:opacity var(--mv-dur) var(--mv-ease),transform var(--mv-dur) var(--mv-ease),filter var(--mv-dur) var(--mv-ease);transition-delay:var(--d,0ms);will-change:opacity,transform}
.mv-in .mv{opacity:1;transform:none;filter:none}
.mv-instant .mv{transition:none!important}
/* headings: wider rise and a light sweep across the gradient words */
.lsec>h2.mv{transform:translate3d(0,48px,0)}
.lsec.mv-in>h2.mv{transform:none}
.lsec>h2 em{background-size:200% 100%}
.mv-in>h2 em{animation:mvSweep 2.2s var(--mv-ease) .35s 1 both}
@keyframes mvSweep{from{filter:brightness(1)}35%{filter:brightness(1.6) drop-shadow(0 0 18px rgba(255,170,60,.55))}to{filter:brightness(1)}}
/* feature rows: text rises, the visual slides in from its side */
.su-feat .su-viz.mv{transform:translate3d(70px,0,0) rotateY(-8deg)}
.su-feat:nth-of-type(even) .su-viz.mv{transform:translate3d(-70px,0,0) rotateY(8deg)}
.mv-in .su-feat .su-viz.mv{transform:none}
/* how it works: a sun line draws across, tiles light up in order */
.pipe .mv-line{position:absolute;left:4%;right:4%;top:41px;height:3px;border-radius:3px;z-index:0;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,#FFC83D,#FF9F1C,#FF5A1F);box-shadow:0 0 14px rgba(255,159,28,.7);transition:transform 1.8s var(--mv-ease) .25s}
.mv-in .pipe .mv-line{transform:scaleX(1)}
.mv-instant .pipe .mv-line{transition:none}
.pipe .tile .ic{transition:box-shadow .6s,transform .6s var(--mv-ease)}
.mv-in .pipe .tile .ic{animation:mvLight .9s var(--mv-ease) both;animation-delay:calc(var(--i,0)*260ms + .35s)}
.mv-instant .pipe .tile .ic{animation:none}
@keyframes mvLight{0%{transform:scale(.8);box-shadow:0 0 0 rgba(255,159,28,0)}55%{transform:scale(1.12);box-shadow:0 0 28px rgba(255,159,28,.75)}100%{transform:none;box-shadow:0 0 10px rgba(255,159,28,.25)}}
/* stats count up and glow once */
.mv-in .su-stat .v{animation:mvGlow 1.6s ease-out .2s both}
@keyframes mvGlow{0%{text-shadow:0 0 0 transparent}40%{text-shadow:0 0 26px rgba(255,159,28,.6)}100%{text-shadow:0 0 0 transparent}}
/* tilt and glow on hover */
.mv-tilt{transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateZ(0);transition:transform .5s var(--mv-ease),box-shadow .5s}
.mv-tilt:hover{box-shadow:0 18px 50px -18px rgba(255,140,30,.45),0 0 0 1px rgba(255,180,80,.25)}
.mv-in .mv-tilt.mv{transition:opacity var(--mv-dur) var(--mv-ease),transform .5s var(--mv-ease),filter var(--mv-dur) var(--mv-ease),box-shadow .5s;transition-delay:var(--d,0ms),0ms,var(--d,0ms),0ms}
/* pricing: moving glow border on Plus, price pop on toggle */
@property --mv-ang{syntax:'<angle>';inherits:false;initial-value:0deg}
.su-plan.hot{position:relative;isolation:isolate}
.su-plan.hot::after{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1.5px;background:conic-gradient(from var(--mv-ang),transparent 0 55%,#FFC83D 70%,#FF5A1F 82%,transparent 95%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:mvSpin 5s linear infinite;pointer-events:none;z-index:2}
@keyframes mvSpin{to{--mv-ang:360deg}}
.mv-pop{animation:mvPop .55s var(--mv-ease)}
@keyframes mvPop{0%{opacity:0;transform:translateY(10px) scale(.94);filter:blur(4px)}100%{opacity:1;transform:none;filter:none}}
.su-toggle{position:relative}
.su-toggle button{transition:color .35s,background .35s}
/* FAQ: smooth open and close */
.faq details{overflow:hidden;transition:background .3s}
.faq details[open]{background:rgba(255,170,60,.04)}
.faq details summary{transition:color .3s}
/* hero entrance (first load only) */
.mv-hero .hero-copy>*{animation:mvHero 1.3s var(--mv-ease) both}
.mv-hero .hero-copy>*:nth-child(2){animation-delay:.12s}.mv-hero .hero-copy>*:nth-child(3){animation-delay:.24s}.mv-hero .hero-copy>*:nth-child(4){animation-delay:.36s}.mv-hero .hero-copy>*:nth-child(5){animation-delay:.48s}.mv-hero .hero-copy>*:nth-child(n+6){animation-delay:.6s}
.mv-hero .scene{animation:mvScene 3.2s var(--mv-ease) both}
.mv-hero .fcard{animation:mvHero 1.4s var(--mv-ease) both;animation-delay:calc(.7s + var(--i,0)*.15s)}
@keyframes mvHero{from{opacity:0;transform:translateY(40px);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
@keyframes mvScene{from{transform:scale(1.08);filter:brightness(.6) saturate(.8)}to{transform:none;filter:none}}
/* login and onboarding: panel entrance, step slides, progress cells, choice cards */
.mv-auth .panel{animation:mvPanel .9s var(--mv-ease) both}
@keyframes mvPanel{from{opacity:0;transform:translateY(30px) scale(.97);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
.mv-step-next .panel>*:not(.row):not(.cells){animation:mvNext .6s var(--mv-ease) both}
.mv-step-prev .panel>*:not(.row):not(.cells){animation:mvPrev .6s var(--mv-ease) both}
.mv-step-next .panel>*:nth-child(n+4),.mv-step-prev .panel>*:nth-child(n+4){animation-delay:.06s}
.mv-step-next .panel>*:nth-child(n+6),.mv-step-prev .panel>*:nth-child(n+6){animation-delay:.12s}
@keyframes mvNext{from{opacity:0;transform:translateX(46px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes mvPrev{from{opacity:0;transform:translateX(-46px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.onb .cells i{position:relative;overflow:hidden}
.onb .cells i.mv-fill{animation:mvCell .7s var(--mv-ease) both}
@keyframes mvCell{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.onbstart .card{transition:transform .45s var(--mv-ease),box-shadow .45s,border-color .45s}
.onbstart .card:hover{transform:translateY(-4px);box-shadow:0 16px 40px -16px rgba(255,140,30,.5)}
.onbstart .card:active{transform:scale(.97)}
.mv-step-next .onbstart .card,.mv-step-prev .onbstart .card{animation:mvHero .8s var(--mv-ease) both;animation-delay:calc(.12s + var(--i,0)*.1s)}
/* finish: sunrise burst before the dashboard */
.mv-sunrise{position:fixed;inset:0;z-index:9999;pointer-events:none;display:grid;place-items:center;background:radial-gradient(circle at 50% 120%,#FFD25A 0,#FF9F1C 18%,#FF5A1F 32%,rgba(40,18,6,.96) 60%,#0d0906 100%);background-size:100% 260%;background-position:50% 0%;animation:mvRise 1.15s var(--mv-ease) both}
.mv-sunrise b{font-family:var(--f-head,inherit);font-size:clamp(26px,4vw,44px);color:#fff7e6;letter-spacing:.02em;text-shadow:0 0 30px rgba(255,170,60,.8);animation:mvHero .9s var(--mv-ease) .15s both}
@keyframes mvRise{0%{opacity:0;background-position:50% 0%}25%{opacity:1}70%{opacity:1;background-position:50% 100%}100%{opacity:0;background-position:50% 100%}}
@media (prefers-reduced-motion: reduce){
  .mv,.mv-in .mv{opacity:1!important;transform:none!important;filter:none!important;transition:none!important}
  .mv-progress,.mv-sky,.mv-sunrise{display:none!important}
  .pipe .mv-line{transform:scaleX(1);transition:none}
  .mv-hero *,.mv-auth *,.mv-step-next *,.mv-step-prev *,.su-plan.hot::after,.mv-in *{animation:none!important}
  .mv-tilt{transform:none!important}
}
.mv-in .mv-tilt.mv,.mv-tilt:not(.mv){transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateZ(0)}


/* ===== round 4: journey, bill check you press, Track my solar extras ===== */
.info.jr-i::after{display:none!important}
.jr-journey{margin-bottom:16px}
.jr-bar{height:6px;border-radius:4px;background:rgba(255,214,170,.1);margin:14px 0 6px;overflow:hidden}
.jr-bar i{display:block;height:100%;background:linear-gradient(90deg,#FF5A1F,#FFC83D);border-radius:4px;transition:width .8s cubic-bezier(.16,1,.3,1)}
.jr-list{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
.jr-list a{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:14px;border:1px solid var(--hairline);text-decoration:none;color:var(--text);background:rgba(255,214,170,.02);transition:border-color .2s,background .2s}
.jr-list a:hover{border-color:rgba(255,200,61,.4)}
.jr-list .jr-n{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:600 13px var(--f-mono,monospace);border:1px solid var(--hairline-2,rgba(255,214,170,.2));color:var(--muted)}
.jr-list .jr-t{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.jr-list li.done .jr-n{background:var(--amber);border-color:transparent;color:#1a1208}
.jr-list li.done b{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(255,214,170,.3)}
.jr-list li.now a{border-color:rgba(255,200,61,.55);background:rgba(255,159,28,.08);box-shadow:0 0 0 4px rgba(255,159,28,.06)}
.jr-list li.now .jr-n{border-color:var(--amber);color:var(--amber);animation:jrPulse 1.8s ease-in-out infinite}
.jr-list li.locked a{opacity:.55}
@keyframes jrPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,159,28,.45)}50%{box-shadow:0 0 0 7px rgba(255,159,28,0)}}
.jr-mini{list-style:none;display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;margin:12px auto 0;padding:0;max-width:640px}
.jr-mini li{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.jr-mini li span{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--hairline);font-size:11px}
.jr-mini li.done{color:var(--text)} .jr-mini li.done span{background:var(--amber);color:#1a1208;border-color:transparent}
.jr-mini li.now{color:var(--amber);font-weight:600} .jr-mini li.now span{border-color:var(--amber)}
.jr-hint{display:flex;gap:10px;align-items:flex-start;border-color:rgba(255,200,61,.4);background:rgba(255,159,28,.07);margin-bottom:14px;color:var(--sun)}
.jr-hint .small{color:var(--text)}
.jr-next{position:sticky;bottom:16px;z-index:5;margin:18px auto 0;max-width:720px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px 12px 18px;border-radius:16px;background:rgba(30,22,14,.92);border:1px solid rgba(255,200,61,.45);box-shadow:0 18px 40px rgba(0,0,0,.45);backdrop-filter:blur(10px);animation:jrUp .5s cubic-bezier(.16,1,.3,1)}
@keyframes jrUp{from{opacity:0;transform:translateY(16px)}}
html[data-theme="light"] .jr-next{background:rgba(255,250,243,.95)}
/* sample bill */
.jr-bill{border:1px dashed rgba(159,211,255,.45);background:rgba(159,211,255,.05);border-radius:14px;padding:12px 14px}
.jr-billgrid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:10px;margin-top:10px}
.jr-billgrid>div{display:flex;flex-direction:column;gap:2px}
.jr-billgrid b.num{font-size:18px}
@media(max-width:560px){.jr-billgrid{grid-template-columns:1fr 1fr}.jr-billgrid>div:first-child{grid-column:span 2}}
/* checking animation */
.jr-checking{padding:28px 24px}
.jr-orb{position:relative;width:96px;height:96px;margin:0 auto}
.jr-orb i{position:absolute;inset:0;border-radius:50%;border:3px solid transparent;border-top-color:#FFC83D;animation:jrSpin 1.1s linear infinite}
.jr-orb i:nth-child(2){inset:12px;border-top-color:#FF9F1C;animation-duration:1.6s;animation-direction:reverse}
.jr-orb i:nth-child(3){inset:28px;border:none;background:radial-gradient(circle,#FFE08A,#FF9F1C 60%,transparent 70%);animation:jrBeat 1.2s ease-in-out infinite}
@keyframes jrSpin{to{transform:rotate(360deg)}}
@keyframes jrBeat{50%{transform:scale(.8);opacity:.7}}
.jr-steps{list-style:none;padding:0;margin:18px auto 0;max-width:380px;display:grid;gap:10px}
.jr-steps li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;border:1px solid var(--hairline);opacity:.35;animation:jrStep .4s ease forwards;animation-delay:calc(var(--k)*.85s + .15s)}
.jr-steps li>div{display:flex;flex-direction:column;flex:1}
.jr-steps .jr-ic{color:var(--sun)}
.jr-steps .jr-tick{color:var(--volt);opacity:0;transform:scale(.4);animation:jrTick .35s ease forwards;animation-delay:calc(var(--k)*.85s + .8s)}
@keyframes jrStep{to{opacity:1;border-color:rgba(255,200,61,.4)}}
@keyframes jrTick{to{opacity:1;transform:none}}
.jr-reveal{animation:jrReveal .9s cubic-bezier(.16,1,.3,1)}
@keyframes jrReveal{from{opacity:0;transform:scale(.96) translateY(10px);filter:blur(6px)}}
/* unlock celebration */
.jr-win{position:fixed;inset:0;z-index:300;display:grid;place-items:center;background:rgba(10,7,4,0);transition:background .4s;padding:16px}
.jr-win.on{background:rgba(10,7,4,.72)}
.jr-rays{position:absolute;left:50%;top:50%;width:160vmax;height:160vmax;transform:translate(-50%,-50%) scale(.2);opacity:0;background:repeating-conic-gradient(from 0deg,rgba(255,200,61,.16) 0 6deg,transparent 6deg 18deg);border-radius:50%;-webkit-mask:radial-gradient(circle,#000 0,transparent 60%);mask:radial-gradient(circle,#000 0,transparent 60%);transition:transform 1.4s cubic-bezier(.16,1,.3,1),opacity .6s}
.jr-win.on .jr-rays{transform:translate(-50%,-50%) scale(1) rotate(25deg);opacity:1}
.jr-wincard{position:relative;max-width:420px;text-align:center;padding:30px 28px;border-radius:24px;background:linear-gradient(180deg,rgba(40,28,16,.96),rgba(22,16,10,.96));border:1px solid rgba(255,200,61,.5);box-shadow:0 0 80px rgba(255,159,28,.35);transform:scale(.85) translateY(20px);opacity:0;transition:all .6s cubic-bezier(.16,1,.3,1) .1s}
.jr-win.on .jr-wincard{transform:none;opacity:1}
.jr-wincard h2{font-size:34px;margin:12px 0 8px}
.jr-wincard p{color:var(--muted);margin-bottom:18px}
.jr-sun{width:74px;height:74px;margin:0 auto 14px;border-radius:50%;background:radial-gradient(circle at 50% 45%,#FFF2C2,#FFC83D 40%,#FF7A1F 75%);box-shadow:0 0 60px rgba(255,180,60,.8);animation:jrRise 1.2s cubic-bezier(.16,1,.3,1)}
@keyframes jrRise{from{transform:translateY(30px) scale(.6);opacity:0}}
html[data-theme="light"] .jr-wincard{background:#FFFAF3}
/* Track my solar */
.jr-two{margin-bottom:16px}
.jr-sunvs,.jr-pbars{display:flex;align-items:flex-end;gap:18px;margin-top:14px;flex-wrap:wrap}
.jr-sunvs>div,.jr-pbars>div:not(.jr-leg){display:flex;flex-direction:column;align-items:center;gap:4px}
.jr-pair{display:flex;align-items:flex-end;gap:4px;height:64px}
.jr-pair.wide{height:94px}
.jr-pair i,.jr-leg i{display:inline-block;width:14px;border-radius:4px 4px 0 0}
.jr-pair.wide i{width:20px}
.jr-pair i{transform-origin:bottom;animation:jrGrow .8s cubic-bezier(.16,1,.3,1)}
@keyframes jrGrow{from{transform:scaleY(0)}}
i.s{background:rgba(159,211,255,.75)} i.o{background:#FF9F1C} i.p{background:rgba(255,214,170,.28);outline:1px dashed rgba(255,214,170,.5)} i.a{background:linear-gradient(180deg,#FFC83D,#FF7A1F)}
.jr-leg{display:flex;flex-direction:column;gap:6px;margin-left:auto;align-self:center}
.jr-leg i{height:10px;width:10px;border-radius:3px;margin-right:6px;vertical-align:middle}
.jr-todo{margin:6px 0 0 18px;padding:0} .jr-todo li{margin:3px 0;color:var(--muted)}
@media(max-width:900px){.jr-two{grid-template-columns:1fr!important}}
.jr-start{max-width:720px;margin-bottom:16px}
.jr-nextbar{margin:0 0 16px;border:1px solid rgba(255,200,61,.35);background:rgba(255,159,28,.06);border-radius:14px}
.jr-nextbar>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:10px 14px;cursor:pointer}
.jr-nextbar>summary::-webkit-details-marker{display:none}
.jr-nb-ic{color:var(--sun);display:inline-flex}
.jr-nextbar .small{flex:1;min-width:0}
.jr-nb-more{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.jr-nextbar[open] .jr-nb-more svg{transform:rotate(180deg)}
.jr-steps2{list-style:none;margin:0;padding:4px 14px 12px;display:grid;gap:6px;border-top:1px solid var(--hairline)}
.jr-steps2 li{display:flex;justify-content:space-between;gap:12px;align-items:center;padding-top:6px}
.jr-steps2 a{display:inline-flex;gap:8px;align-items:center;color:var(--text);text-decoration:none;font-size:14px}
.jr-steps2 a:hover{color:var(--sun)}
@media(max-width:600px){.jr-nb-more{display:none}.jr-steps2 li{flex-direction:column;align-items:flex-start;gap:2px}}

/* ===== round 5: Helios brief on Home + chat controls ===== */
.navorb{margin:0 1px}
.hxb{position:relative;overflow:hidden;margin-bottom:16px;padding:22px 24px;border-color:rgba(255,200,61,.35)!important;background:radial-gradient(90% 140% at 0% 0%,rgba(255,159,28,.16),transparent 55%),var(--glass)!important}
.hxb::after{content:"";position:absolute;right:-90px;top:-90px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(255,200,61,.13),transparent 65%);pointer-events:none}
.hxb-head{display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative;z-index:1}
.hxb-who{display:flex;align-items:center;gap:12px;min-width:0}
.hxb-r{display:flex;align-items:center;gap:8px}
.hxb-ib{width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;border:1px solid var(--hairline-2);background:transparent;color:var(--muted);cursor:pointer}
.hxb-ib:hover{color:var(--text);border-color:rgba(255,200,61,.5)}
.hxb-say{font-size:21px;line-height:1.38;letter-spacing:-.02em;margin:16px 0 0;max-width:820px;font-weight:500;color:var(--text)}
.hxb-say b{color:var(--sun);font-weight:650}
.hxb-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px;max-width:820px}
.hxb-stat{display:flex;flex-direction:column;gap:1px;padding:10px 12px;border-radius:14px;border:1px solid var(--hairline);background:rgba(0,0,0,.18)}
.hxb-stat b{font-size:18px}
.hxb-why{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px}
.hxb-why .linkbtn{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.hxb-why .linkbtn:hover{color:var(--text)}
.hxb-logs{margin-top:16px;display:flex;flex-direction:column;gap:10px}
.hxb-loghead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hxb-week{display:flex;align-items:center;gap:5px}

function brgyMetrics(b){

function lineChart(series,labels,{h=230,fmtY=v=>fmt.n(v),zero=false,marker=null,ariaLabel='Line chart'}={}){
  const W=640,pl=56,pr=14,pt=14,pb=28,iw=W-pl-pr,ih=h-pt-pb;
  const all=series.flatMap(s=>s.data.filter(v=>v!=null));
  let mn=Math.min(...all,zero?0:Infinity), mx=Math.max(...all);
  if(zero) mn=Math.min(0,mn);
  const step=niceMax((mx-mn)/4||1); mn=Math.floor(mn/step)*step; mx=Math.ceil(mx/step)*step; if(mx===mn) mx=mn+step;
  const nT=Math.round((mx-mn)/step);
  const X=i=>pl+iw*i/(labels.length-1), Yv=v=>pt+ih-(v-mn)/(mx-mn)*ih;
  let g=''; for(let i=0;i<=nT;i++){const v=mn+step*i,y=Yv(v); g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="rgba(255,214,170,${Math.abs(v)<1e-9?'.3':'.07'})"/><text x="${pl-8}" y="${y+4}" text-anchor="end" font-size="10.5" fill="#A8998A">${fmtY(v)}</text>`;}
  const lstep=Math.ceil(labels.length/12);
  const xl=labels.map((l,i)=>i%lstep===0||i===labels.length-1?`<text x="${X(i)}" y="${h-8}" text-anchor="middle" font-size="10.5" fill="#A8998A">${l}</text>`:'').join('');
  const paths=series.map(s=>{ const pts=s.data.map((v,i)=>v==null?null:[X(i),Yv(v)]); let d='',started=false; pts.forEach(p=>{ if(!p){started=false;return;} d+=(started?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1); started=true; });
    const first=pts.findIndex(p=>p), last=pts.length-1-[...pts].reverse().findIndex(p=>p);
    const area=s.area?`<path d="${d}L${pts[last][0]},${Yv(Math.max(mn,0))}L${pts[first][0]},${Yv(Math.max(mn,0))}Z" fill="url(#gArea)"/>`:'';
    const dots=s.dots?pts.map(p=>p?`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="${s.color}"/>`:'').join(''):'';
    return area+`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.w||2.4}" ${s.dash?`stroke-dasharray="${s.dash}"`:''} ${s.glow?'filter="url(#glow)"':''} stroke-linejoin="round"/>`+dots; }).join('');
  const mk=marker?`<circle cx="${pl+iw*marker.x/(labels.length-1)}" cy="${Yv(marker.y)}" r="6" fill="#FFE7A8" stroke="#FF9F1C" stroke-width="3" filter="url(#glow)"/><text x="${pl+iw*marker.x/(labels.length-1)+10}" y="${Yv(marker.y)-16}" font-size="11.5" fill="#FFC83D" font-weight="700">${esc(marker.label)}</text>`:'';
  return `<svg viewBox="0 0 ${W} ${h}" width="100%" role="img" aria-label="${esc(ariaLabel)}">${GRADS}${g}${xl}${paths}${mk}</svg>`;
}
function donut(segs,{size=170,label='',sub=''}={}){
  const r=size/2-14,c=size/2,C=2*Math.PI*r,tot=segs.reduce((s,x)=>s+x.v,0); let off=0;
  const arcs=segs.map(s=>{const l=C*s.v/tot; const a=`<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${s.color}" stroke-width="16" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-off}" transform="rotate(-90 ${c} ${c})"><title>${esc(s.name)}: ${(s.v/tot*100).toFixed(1)}%</title></circle>`; off+=l; return a;}).join('');
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="Breakdown">${arcs}<text x="${c}" y="${c-2}" text-anchor="middle" font-size="22" font-weight="700" fill="#FBF3E8" font-family="Inter">${label}</text><text x="${c}" y="${c+16}" text-anchor="middle" font-size="10.5" fill="#A8998A">${sub}</text></svg>`;
}
function ring(pct,{size=150,stroke=12,color='url(#gRing)',center='',sub='',id=''}={}){

  return `<div class="ring" style="width:${size}px;height:${size}px"><svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" aria-hidden="true">${GRADS}<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="rgba(255,214,170,.1)" stroke-width="${stroke}"/><circle ${id?`id="${id}"`:''} cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-Math.min(1,pct))}" transform="rotate(-90 ${c} ${c})" filter="url(#glow)" style="transition:stroke-dashoffset 1.2s ease-out"/></svg><div class="c"><div class="num" style="font-size:${size/4.6}px;line-height:1">${center}</div><div class="xs muted" style="margin-top:4px">${sub}</div></div></div>`;

    // rooftops silhouette
    ctx.fillStyle='#0A0806'; const base=hy+34;
    roofs.forEach(o=>{ if(Math.abs(o.x+o.bw/2-cx)<70) return; const y=base+Math.max(0,(Math.abs(o.x+o.bw/2-cx)/w)*40)-o.bh; ctx.beginPath();
      if(o.peak){ctx.moveTo(o.x,y+12);ctx.lineTo(o.x+o.bw/2,y);ctx.lineTo(o.x+o.bw,y+12);} else {ctx.moveTo(o.x,y);ctx.lineTo(o.x+o.bw,y);}
      ctx.lineTo(o.x+o.bw,h);ctx.lineTo(o.x,h);ctx.closePath();ctx.fill();
      if(o.panel){ ctx.save(); ctx.strokeStyle='rgba(255,190,90,.55)'; ctx.lineWidth=1; const px=o.x+o.bw*.18, pw=o.bw*.3, py=o.peak?y+2:y-5;
        for(let q=0;q<3;q++){ ctx.beginPath(); ctx.moveTo(px+q*pw*.36,py+(o.peak?q*1.6:0)); ctx.lineTo(px+q*pw*.36+pw*.3,py+(o.peak?q*1.6:0)); ctx.stroke(); } ctx.restore(); }
    });
    g=ctx.createLinearGradient(0,base-60,0,h); g.addColorStop(0,'rgba(10,8,6,0)'); g.addColorStop(1,'rgba(10,8,6,1)'); ctx.fillStyle=g; ctx.fillRect(0,base-60,w,h);
    if(!reduce&&document.getElementById('heroCanvas')===cv) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
function countUp(){
  document.querySelectorAll('[data-count]').forEach(el=>{ const n=+el.dataset.count,d=+el.dataset.dec,pre=el.dataset.pre||'',suf=el.dataset.suf||''; if(matchMedia('(prefers-reduced-motion: reduce)').matches||!n) return; const t0=performance.now();
    const step=t=>{ const k=Math.min(1,(t-t0)/1100), e=1-Math.pow(1-k,3); el.textContent=pre+(n*e).toFixed(d)+suf; if(k<1) requestAnimationFrame(step); }; requestAnimationFrame(step); });
}

function catSegs(){ const by={}; S.apps.forEach(a=>{ const k=a.cat==='other'?(/fan/i.test(a.name)?'Fans':/tv|computer|pc/i.test(a.name)?'Electronics':/bulb|light/i.test(a.name)?'Lighting':'Cooking and others'):CAT_NAMES[a.cat]; by[k]=(by[k]||0)+appKwh(a); });
  const cols=['#FF5A1F','#FFC83D','#FF9F1C','#5EE6A8','#E3B6FF','#9FD3FF','#FF4D6D','#d9cbbb']; return Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([name,v],i)=>({name,v,color:cols[i%cols.length]})); }
function legendList(segs){ const t=segs.reduce((s,x)=>s+x.v,0); return `<div class="stack" style="gap:8px;min-width:0;flex:1">${segs.map(s=>`<div class="row between small" style="flex-wrap:nowrap"><span class="row" style="gap:8px;flex-wrap:nowrap;min-width:0"><i style="width:10px;height:10px;border-radius:3px;background:${s.color};flex:none"></i><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${s.name}</span></span><b class="num" style="font-size:13px">${(s.v/t*100).toFixed(1)}%</b></div>`).join('')}</div>`; }

function vDash(){

  const fc=[...Array(11)].map(()=>null).concat([Math.round(426*1.0)]); // placeholder end
  // forecast next 3 months: baseline level of last 3 bills, seasonal index 1.0 (TBD-5)
  const L=(455+430+426)/3; const lab2=labels.concat(['Oct','Nov']); const act2=actual.concat([null,null]);
  const fcast=lab2.map((_,i)=>i>=10?Math.round(L):null);
  const sim2=lab2.map((_,i)=>i===10?+(h.day*30).toFixed(1):null);

  const next=!h.conf?['receipt','Confirm one Meralco bill','It checks our estimate and unlocks your solar results.','bill']:!h.unlocked?['receipt','Fix the gap between your bill and our estimate','Your bill match score is Low, so solar stays locked.','bill']:S.stage<2?['route','Request quotes from up to 3 installers','Your recommendation is ready to share, with your consent.','next']:['route','Compare the quote you received','Quote X is 37% above typical Lucena prices. See why.','next'];
  return pageHead('Magandang araw, Maria.','Here is where your electricity goes and what solar could do for your home.',`<span class="chip">${S.brgy} · ${S.size} people</span>`)+
  `<div class="grid g4">
    <div class="card kpi"><div class="label">Average monthly use ${tag('bill')}</div><div class="value num">${fmt.n(BILLS_HISTORY.reduce((s,b)=>s+b.k,0)/BILLS_HISTORY.length,0)} kWh</div><div class="sub">Last 11 bills · ${h.band} use, ${h.cool>=.4?'cooling-dominant':'standard'}</div></div>
    <div class="card kpi"><div class="label">Average monthly bill ${tag('comp')}</div><div class="value num">${fmt.peso(BILLS_HISTORY.reduce((s,b)=>s+b.k,0)/BILLS_HISTORY.length*K.R_RETAIL)}</div><div class="sub">At ₱14.7424/kWh (Sept 2026)</div></div>
    <div class="card kpi row" style="gap:16px;flex-wrap:nowrap">${h.conf?ring(h.conf.C/100,{size:86,stroke:8,center:h.conf.C.toFixed(1),color:h.conf.band==='Low'?'#FF4D6D':'url(#gRing)'}):ring(0,{size:86,stroke:8,center:'–'})}<div><div class="label">Bill match score</div>${h.conf?`<span class="chip ${bandClass(h.conf.band)}" style="margin-top:8px">${h.conf.band}</span>`:'<span class="chip dash" style="margin-top:8px">No bill yet</span>'}</div></div>
    <div class="card kpi ${h.unlocked?'card-hot':''}"><div class="label">Solar for your home</div>${h.unlocked?`<div class="value num">${r?r.kwp.toFixed(2)+' kWp':'Not viable'}</div><div class="sub">${r?`${r.N} panels · payback ${r.pb.toFixed(1)} yr`:'See your efficiency plan'}</div>`:`<div class="value num" style="color:var(--muted)">${ic('lock',22)} Locked</div><div class="sub">Validate a bill first</div>`}</div></div>
  <div class="grid" style="grid-template-columns:minmax(0,2fr) minmax(0,1fr)">
    <div class="card"><div class="card-head"><div><h3>Monthly consumption</h3><p class="xs muted">Actual bills, this month's simulation, and the next 2 months' forecast</p></div><div class="legend"><span><i style="background:#FF9F1C"></i>Actual</span><span><i style="background:transparent;border:2px solid #FBF3E8"></i>Simulated</span><span><i style="background:repeating-linear-gradient(90deg,#FFC83D 0 3px,transparent 3px 5px)"></i>Forecast</span></div></div>
      ${lineChart([{data:act2,color:'#FF9F1C',area:true,glow:true,dots:true},{data:sim2,color:'#FBF3E8',dots:true,w:0},{data:lab2.map((_,i)=>i===10?426:i>10?Math.round(L):null),color:'#FFC83D',dash:'5 5'}],lab2,{fmtY:v=>Math.round(v),ariaLabel:'Monthly kWh: actual bills October 2025 to August 2026, simulated 452.8 kWh, forecast 437 kWh'})}
      <p class="xs faint">Forecast uses the average of your last 3 bills with a flat seasonal profile until 12 bills exist (SRS D.8).</p></div>
    <div class="card"><h3>Where it goes</h3><div class="row" style="margin-top:12px;flex-wrap:nowrap;gap:16px">${donut(segs,{size:150,label:h.day.toFixed(1),sub:'kWh a day'})}</div><div style="margin-top:14px">${legendList(segs.slice(0,5))}</div></div></div>
  <div class="grid g2">
    <div class="card card-hot glow-edge"><div class="eyebrow">Your next step</div><div class="row" style="margin-top:12px;gap:14px;flex-wrap:nowrap"><div style="color:var(--sun)">${ic(next[0],28)}</div><div><h3 style="font-size:19px">${next[1]}</h3><p class="small muted" style="margin-top:4px">${next[2]}</p></div></div><a class="btn btn-primary" style="margin-top:16px" href="#${next[3]}">Continue ${ic('arrow',16)}</a></div>
    <div class="card"><div class="card-head"><h3>Your solar journey</h3><a class="small" href="#next">Details</a></div>${stagesBar()}</div></div>`;
}
function stagesBar(){ return `<div class="stages">${STAGES.map((s,i)=>`<div class="stage ${i<S.stage?'done':i===S.stage?'now':''}"><div class="cell"></div>${s}</div>`).join('')}</div>`; }

  <div class="card"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Appliance</th><th>Watts</th><th>Qty</th><th>Hours/day</th><th>Days/wk</th><th class="r">kWh/day</th><th>Share</th><th></th><th></th></tr></thead><tbody>${rows}</tbody>

    <details style="margin-top:14px"><summary class="small" style="cursor:pointer;color:var(--amber)">How we computed this</summary><div class="calc" style="margin-top:10px">kWh/day = watts × qty × hours × (days ÷ 7) × DF ÷ 1000
Aircon: 750 × 2 × 8 × (7 ÷ 7) × 0.80 ÷ 1000 = 9.600 kWh/day
DF: refrigeration 0.40 · non-inverter aircon 0.80 · inverter aircon 0.60 · washing machine 0.70 · others 1.00 (SRS Table D.1.1, to be calibrated)</div></details></div>`;

function vLog(){
  const key=S.logDate, entry=S.log[key]||S.apps.map(a=>({id:a.id,h:a.h}));
  const tot=entry.reduce((s,e)=>{const a=S.apps.find(x=>x.id===e.id); return a?s+a.w*a.q*e.h*DF[a.cat]/1000:s;},0);
  const r=rng(3); const days=[...Array(30)].map((_,i)=>13.2+r()*3.6);
  return pageHead('Daily log','Write down how long you actually used each appliance on a day. Over time this shows if our estimate matches real life.','',"Ano ang ginamit mo kahapon? / What did you use yesterday?")+
  `<div class="grid" style="grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)">
  <div class="card"><div class="row between"><label class="f" for="logDate" style="max-width:220px">Date<input class="input" type="date" id="logDate" value="${key}" max="2026-10-06" data-in="logDate"></label><div class="kpi" style="text-align:right"><div class="label" style="justify-content:flex-end">Day total</div><div class="value num" id="logTot">${tot.toFixed(2)} kWh</div><div class="sub">${fmt.peso(tot*K.R_RETAIL)}</div></div></div>
    <div class="tbl-wrap" style="margin-top:12px"><table class="tbl"><thead><tr><th>Appliance</th><th>Hours used</th></tr></thead><tbody>${entry.map(e=>{const a=S.apps.find(x=>x.id===e.id); return a?`<tr><td>${esc(a.name)} ${a.q>1?`<span class="xs muted">× ${a.q}</span>`:''}</td><td><input class="input" style="width:90px;padding:6px 8px" type="number" min="0" max="24" step="0.5" value="${e.h}" data-in="log:${e.id}" aria-label="Hours for ${esc(a.name)}"></td></tr>`:'';}).join('')}</tbody></table></div>
    <div class="row" style="margin-top:14px"><button class="btn btn-primary" data-act="saveLog">Save entry</button><button class="btn btn-ghost" data-act="delLog">Delete entry</button></div></div>
  <div class="stack"><div class="card kpi"><div class="label">30-day running average ${tag('you')}</div><div class="value num">${(days.reduce((a,b)=>a+b)/30).toFixed(2)} kWh/day</div><div class="sub">Simulation says ${H().day.toFixed(2)} kWh/day</div></div>
    <div class="card"><h3>Last 30 days</h3><div style="display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin-top:12px">${days.map((d,i)=>`<div title="Sep ${7+i}: ${d.toFixed(1)} kWh" style="aspect-ratio:1;border-radius:5px;background:rgba(255,${Math.round(220-(d-13)*30)},60,${(.25+(d-13)/5).toFixed(2)})"></div>`).join('')}</div><div class="row between xs muted" style="margin-top:8px"><span>Lighter = less</span><span>Darker = more</span></div></div></div></div>`;

function vBill(){
  const h=H(), b=S.bill, days=billDays();
  const errs={}; if(days<20||days>40) errs.days='A billing period must be 20 to 40 days. Check the start and end dates.'; if(!(b.kwh>=1&&b.kwh<=5000)) errs.kwh='Enter the kWh from your bill, between 1 and 5,000.'; if(!(b.amount>0)) errs.amount='Enter the total amount due.';

      <label class="f" for="bE">Billing period end<input class="input ${errs.days?'err':''}" type="date" id="bE" value="${b.end}" data-in="bill:end"></label>
      ${errs.days?`<div class="ferr span2">${errs.days}</div>`:`<div class="xs muted span2">${days} days</div>`}
      <label class="f" for="bK">kWh consumed<input class="input ${errs.kwh?'err':''}" type="number" id="bK" value="${b.kwh}" data-in="bill:kwh">${errs.kwh?`<span class="ferr">${errs.kwh}</span>`:''}</label>
      <label class="f" for="bA">Total amount (₱)<input class="input ${errs.amount?'err':''}" type="number" step="0.01" id="bA" value="${b.amount}" data-in="bill:amount">${errs.amount?`<span class="ferr">${errs.amount}</span>`:rateWarn?`<span class="ferr" style="color:var(--caution)">That's ₱${rate.toFixed(2)}/kWh, far from Meralco's ₱14.74. Please double-check (you can still continue).</span>`:''}</label>
      <label class="f span2" for="bU">Distribution utility<select class="input" id="bU" data-in="bill:du"><option>Meralco</option></select></label></div>`
    :`<div class="lockcard" style="cursor:pointer" data-act="fakeUpload"><div style="color:var(--sun)">${ic('upload',30)}</div><b style="display:block;margin-top:10px">Drop a photo or PDF of your bill, or click to choose</b><p class="xs muted" style="margin-top:6px">We pre-fill the 4 fields for you to confirm. The file is deleted within 24 hours. Nothing is saved until you confirm.</p></div>`;
  let result='';
  if(h.conf){ const c=h.conf, low=c.band==='Low';
    result=`<div class="card ${low?'':'card-hot'} unlock-anim" style="overflow:hidden;${low?'border-color:rgba(255,77,109,.35)':''}"><div class="beam"></div>
      <div class="grid" style="grid-template-columns:auto minmax(0,1fr);gap:26px;align-items:center">
        ${ring(c.C/100,{size:170,stroke:13,center:`<span data-count="${c.C.toFixed(1)}" data-dec="1">${c.C.toFixed(1)}</span>`,sub:'Match score',color:low?'#FF4D6D':'url(#gRing)'})}
        <div><span class="chip ${bandClass(c.band)}">${low?ic('stop',13):ic('check2',13)} ${c.band} band</span>
          <h3 style="font-size:24px;margin-top:10px">${low?'Solar stays locked for now':'Solar features unlocked'}</h3>
          <p class="muted" style="margin-top:6px">${low?`Your bill says ${fmt.n(h.bill)} kWh but our estimate is ${fmt.n(h.sim,1)} kWh for the same ${h.days} days, a ${fmt.pct(c.dev)} gap. We'd rather fix the profile than show you wrong solar numbers.`:`Your bill (${fmt.n(h.bill)} kWh) and our estimate (${fmt.n(h.sim,1)} kWh) differ by only ${fmt.pct(c.dev)}.${c.band==='Moderate'?' Results are unlocked; recalibrating would make them sharper.':''}`}</p>
          <div style="margin-top:14px">${hbars([{l:'Simulated, same '+h.days+' days',v:h.sim},{l:'Billed',v:h.bill,c:'rgba(159,211,255,.8)'}],v=>fmt.n(v,1)+' kWh')}</div></div></div>
      ${low?`<div class="grid g3" style="margin-top:16px">${[['Aircon hours may be overstated','Your 2 aircons at 8 hours make up most of the estimate. If they ran 5 hours, the gap closes.','appliances'],['A big appliance may be missing or off','Check for a water heater, iron or second refrigerator.','appliances'],['The bill may cover fewer days','Check the period dates on the bill.','bill']].map(([t,s,r])=>`<div class="card"><b class="small">${t}</b><p class="xs muted" style="margin-top:6px">${s}</p><a class="btn btn-sm" style="margin-top:10px" href="#${r}">Fix it</a></div>`).join('')}</div><p class="xs muted" style="margin-top:10px">Suggested by Helios from your appliance list.</p>`
      :`<div class="row" style="margin-top:16px"><a class="btn btn-primary" href="#roof">${ic('roof',16)} Next: map your roof</a><a class="btn" href="#solar">See solar feasibility</a></div>`}

High ≥ 80 · Moderate 60–79.9 · Low &lt; 60 (SRS D.2)</div></details></div>`; }
  return pageHead('Check against your Meralco bill','Type in one recent bill. If our estimate is close to it, your solar results unlock.',`<button class="btn btn-sm btn-ghost" data-act="lowDemo">${S.lowDemo?'Show the normal case':'Show a Low-band case'}</button>`,'Ilagay ang detalye ng iyong Meralco bill. / Enter your Meralco bill details.')+

  <div>${result||`<div class="lockcard"><p class="muted">Confirm a bill to see your bill match score.</p></div>`}</div></div>`;
}

  if(!r||S.owner==='Renter') return pageHead('Your solar system','')+`<div class="card" style="border-color:rgba(242,208,75,.35)"><div class="row" style="color:var(--caution);gap:10px">${ic('warn',22)}<h3>Rooftop solar isn't recommended for this home right now</h3></div><p class="muted" style="margin-top:8px">${S.owner==='Renter'?'You rent this property, so the owner would need to install and own the system.':'No system size pays back within its life at current prices.'} Your efficiency plan below is the best next step.</p><a class="btn btn-primary" style="margin-top:14px" href="#eff">Open my efficiency plan</a></div>`;
  const c=cashflow(r.kwp,r.I,h.Eyear,h.f); const over=h.sz.rows[r.N];

function vPerf(){

  return pageHead('Is my solar doing well?','After installation, enter what your system produced each month. We compare it with what was promised.',`<span class="chip ${S.stage>=5?'good':'dash'}">${S.stage>=5?'Installed':'Preview with sample data'}</span>`)+
  (S.stage<5?`<div class="card" style="border-style:dashed"><p class="small muted">${ic('info',14)} This page opens for real after your stage reaches <b>Installed</b>. Below is a preview with sample readings for a 3.30 kWp east-facing system.</p></div>`:'')+
  `<div class="grid g3"><div class="card kpi"><div class="label">How well it's performing (PI) ${info('Actual generation divided by expected generation for the month. Below 0.80 for 2 months in a row triggers an alert.')}</div><div class="value num" style="color:${PI[PI.length-1]<.8?'var(--critical)':'var(--sun)'}">${PI[PI.length-1].toFixed(2)}</div><div class="sub">${S.perf[S.perf.length-1].m}: ${S.perf[S.perf.length-1].g} of ${exp[exp.length-1].toFixed(1)} kWh expected</div></div>
   <div class="card kpi"><div class="label">Actual savings, ${S.perf[S.perf.length-1].m} ${tag('comp')}</div><div class="value num">${fmt.peso((S.perf[S.perf.length-1].g-S.perf[S.perf.length-1].exp)*K.R_RETAIL+S.perf[S.perf.length-1].exp*K.R_BGC)}</div><div class="sub">Self-used at retail, export at ₱9.70</div></div>
   <div class="card kpi"><div class="label">Status</div>${alert?`<div class="value" style="color:var(--critical);font-size:20px">${ic('stop',20)} Underperforming</div><div class="sub">Below 0.80 for 2 months. Check for shading, dirt or an inverter fault, then contact your installer.</div>`:`<div class="value" style="color:var(--volt);font-size:20px">${ic('check2',20)} On track</div><div class="sub">No alert. Threshold 0.80 for 2 months.</div>`}</div></div>

function effActions(){
  const acs=S.apps.filter(a=>a.cat==='ac');
  const acts=[];
  acs.forEach(a=>{ const dE=a.w*a.q*a.h*(a.d/7)*(DF.ac-DF.acinv)/1000; acts.push({id:'inv'+a.id,t:`Switch ${a.q>1?'both':'the'} ${a.name.replace(', non-inverter','')} to inverter units`,kwh:dE*365,cost:32000*a.q,ic:'ac'}); });
  acs.forEach(a=>{ const dE=a.w*a.q*1*(a.d/7)*DF[a.cat]/1000; acts.push({id:'hr'+a.id,t:'Run the aircons 1 hour less each day',kwh:dE*365,cost:0,ic:'ac'}); });
  acs.forEach(a=>{ const dE=a.w*a.q*a.h*(a.d/7)*DF[a.cat]/1000*0.06; acts.push({id:'sp'+a.id,t:'Raise the aircon set point from 24 °C to 26 °C',kwh:dE*365,cost:0,ic:'ac'}); });

function applyFaces(){ const tot=S.roof.faces.reduce((s,f)=>s+f.area,0); const best=[...S.roof.faces].sort((a,b)=>b.area-a.area)[0]; S.roof.traced=+tot.toFixed(1); S.roof.usable=tot*S.roof.usableAdj; S.roof.dir=best.dir; S.roof.source='Traced'; S.panels=null; render(); }
function chatAsk(q){ if(!q.trim()) return; S.chat.push({who:'me',t:esc(q)}); const full=aiAnswer(q); S.chat.push({who:'ai',t:''}); render(); const words=full.split(/(\s+)/); let i=0; const msg=S.chat[S.chat.length-1];
  const tick=()=>{ i+=3; msg.t=words.slice(0,i).join('')+(i<words.length?' ▍':'')+(i>=words.length?`<div class="xs" style="opacity:.6;margin-top:8px">Explains your computed results; not financial or engineering advice.</div>`:''); const box=document.getElementById('chat'); if(box){ box.lastElementChild.innerHTML=msg.t; box.scrollTop=box.scrollHeight; } if(i<words.length) setTimeout(tick,40); }; tick(); }

function onInput(e){
  const el=e.target, k=el.dataset.in; if(!k) return;
  const v=el.type==='checkbox'?el.checked:el.value;
  if(k==='role'){ S.role=v; go(v==='planner'?'g-overview':v==='admin'?'admin':'dash'); return; }
  if(k.startsWith('app:')){ const [,id,f]=k.split(':'); const a=S.apps.find(x=>x.id==id); const n=parseFloat(v); if(isNaN(n)||n<0){ el.classList.add('err'); return; } el.classList.remove('err'); a[f]=n; S.panels=null; updateAppTotals(); return; }
  if(k.startsWith('bill:')){ const f=k.split(':')[1]; S.bill[f]=f==='kwh'||f==='amount'?parseFloat(v):v; if(e.type==='change') render(); return; }
  if(k==='panels'){ S.panels=+v; render(); document.getElementById('panelSlider')?.focus(); return; }
  if(k==='usableAdj'){ S.roof.usableAdj=+v/100; S.roof.usable=S.roof.traced*S.roof.usableAdj; S.panels=null; render(); return; }
  if(k==='roofArea'){ const n=parseFloat(v); if(n>0){ S.roof.traced=n; S.roof.usable=n*S.roof.usableAdj; S.roof.source='Typed'; S.panels=null; if(e.type==='change') render(); } return; }
  if(k==='pitch'){ S.roof.pitch=v; S.panels=null; render(); return; }
  if(k.startsWith('scen:')){ const f=k.split(':')[1]; S.scen[f]=f==='sel'?v:f==='T'?+v:(+v/100); render(); document.getElementById({s:'scS',a:'scA',T:'scT',sel:'scSel'}[f])?.focus(); return; }
  if(k.startsWith('qsel:')){ const id=k.slice(5); if(v){ if(S.quotesReq.length>=3){ el.checked=false; toast('You can request quotes from up to 3 installers at a time.'); return; } S.quotesReq.push(id);} else S.quotesReq=S.quotesReq.filter(x=>x!==id); render(); return; }
  if(k.startsWith('nm:')){ const i=+k.slice(3); S.nmDone=v?[...S.nmDone,i]:S.nmDone.filter(x=>x!==i); render(); return; }
  if(k.startsWith('elig:')){ S.eligChecks[k.slice(5)]=v; return; }
  if(k.startsWith('log:')){ const id=+k.slice(4); const entry=S.log[S.logDate]||S.apps.map(a=>({id:a.id,h:a.h})); entry.find(x=>x.id===id).h=parseFloat(v)||0; S.log[S.logDate]=entry; if(e.type==='change') render(); return; }
  if(k==='logDate'){ S.logDate=v; render(); return; }
  if(k==='gSort'){ S.gSort=v; render(); return; }
  if(['size','floors'].includes(k)){ S[k]=+v; return; }
  if(['brgy','owner','roofType','shading'].includes(k)){ S[k]=v; if(S.route!=='onboard') render(); return; }
}

/* Animated dawn scene: sky, Mt. Banahaw, mist, rooftops with panels, power lines carrying current. Drawn in code so it runs offline. */
function dawnCanvas(){
  const cv=document.getElementById('dawnCanvas'); if(!cv) return;
  const ctx=cv.getContext('2d'); const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let w,h,dpr; const R=rng(11); let houses=[],back=[],palms=[],birds=[],poles=[];
  function build(){
    houses=[];back=[];palms=[];poles=[];birds=[];
    let x=-20; while(x<w+40){ const bw=46+R()*70, bh=26+R()*30; back.push({x,bw,bh,peak:R()<.65}); x+=bw+2+R()*8; }
    x=-30; while(x<w+60){ const bw=70+R()*90, bh=34+R()*34; houses.push({x,bw,bh,peak:R()<.7,panels:R()<.6,pn:2+Math.floor(R()*3)}); x+=bw+6+R()*18; }
    for(let i=0;i<Math.max(2,Math.round(w/360));i++){ const side=i%2?R()*.22:.78+R()*.22; palms.push({x:side*w,s:.7+R()*.5,ph:R()*6}); }
    const n=Math.max(3,Math.ceil(w/420)); for(let i=0;i<=n;i++) poles.push(-40+i*(w+80)/n);
    for(let i=0;i<(w<600?3:6);i++) birds.push({x:R()*w,y:.07+R()*.08,s:.6+R()*.6,v:.15+R()*.25,ph:R()*6});
  }
  function size(){ dpr=Math.min(2,devicePixelRatio||1); w=cv.clientWidth; h=cv.clientHeight; if(!w||!h) return; cv.width=w*dpr; cv.height=h*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); build(); }
  size(); try{ new ResizeObserver(size).observe(cv); }catch(e){ addEventListener('resize',size); }
  const t0=performance.now();
  function ridge(base,amp,seed,step){ ctx.beginPath(); ctx.moveTo(0,h); for(let x=0;x<=w+step;x+=step){ const k=x/w; const y=base-amp*(Math.exp(-Math.pow((k-.62)/.2,2))*1+.25*Math.sin(k*9+seed)+.12*Math.sin(k*23+seed*2)); ctx.lineTo(x,y);} ctx.lineTo(w,h); ctx.closePath(); }
  function frame(now){
    if(!w){ size(); }
    const T=reduce?30:(now-t0)/1000;
    const rise=Math.min(1,T/14), ease=1-Math.pow(1-rise,3);
    const hz=h*.70;                                   // horizon line
    const sx=w*.66, sy=hz+40-ease*(h*.42)+Math.sin(T*.3)*2; // sun climbs over the ridge
    // sky
    let g=ctx.createLinearGradient(0,0,0,hz); g.addColorStop(0,'#EFE7E1'); g.addColorStop(.45,`rgb(252,${226-Math.round(8*ease)},${196-Math.round(16*ease)})`); g.addColorStop(.85,'#FFC98A'); g.addColorStop(1,'#FFB56A');
    ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
    // sun bloom and rays
    g=ctx.createRadialGradient(sx,sy,0,sx,sy,Math.max(w,h)*.75); g.addColorStop(0,'rgba(255,250,232,1)'); g.addColorStop(.06,'rgba(255,236,190,.95)'); g.addColorStop(.18,'rgba(255,196,110,.45)'); g.addColorStop(.45,'rgba(255,160,80,.12)'); g.addColorStop(1,'rgba(255,160,80,0)');
    ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
    ctx.save(); ctx.translate(sx,sy); ctx.rotate(T*.02); ctx.globalCompositeOperation='lighter';
    for(let i=0;i<16;i++){ const a=i/16*Math.PI*2, al=.035+.03*Math.sin(T*.5+i*1.7); ctx.fillStyle=`rgba(255,226,170,${al.toFixed(3)})`; ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,Math.max(w,h),a,a+.07); ctx.closePath(); ctx.fill(); }
    ctx.restore();
    ctx.fillStyle='rgba(255,252,240,1)'; ctx.beginPath(); ctx.arc(sx,sy,Math.max(26,w*.028),0,7); ctx.fill();
    // far ridge (Mt. Banahaw) and mist
    ridge(hz-10,h*.2,1.3,8); ctx.fillStyle='rgba(222,180,160,.75)'; ctx.fill();
    for(let i=0;i<3;i++){ const y=hz-30+i*22, off=(T*(6+i*3))%(w*1.4); g=ctx.createLinearGradient(0,y-26,0,y+26); g.addColorStop(0,'rgba(255,240,226,0)'); g.addColorStop(.5,`rgba(255,240,226,${.5-i*.1})`); g.addColorStop(1,'rgba(255,240,226,0)'); ctx.fillStyle=g;
      for(let k=-1;k<2;k++){ ctx.beginPath(); ctx.ellipse(off-w*.2+k*w*1.4,y,w*.55,26,0,0,7); ctx.fill(); } }
    ridge(hz+12,h*.09,4.1,10); ctx.fillStyle='rgba(196,138,108,.85)'; ctx.fill();
    // back rooftops
    const bb=hz+44; ctx.fillStyle='#A86D4E';
    back.forEach(o=>{ const y=bb-o.bh; ctx.beginPath(); if(o.peak){ctx.moveTo(o.x,y+10);ctx.lineTo(o.x+o.bw/2,y);ctx.lineTo(o.x+o.bw,y+10);}else{ctx.moveTo(o.x,y);ctx.lineTo(o.x+o.bw,y);} ctx.lineTo(o.x+o.bw,h);ctx.lineTo(o.x,h);ctx.closePath();ctx.fill(); });
    g=ctx.createLinearGradient(0,bb-50,0,bb+30); g.addColorStop(0,'rgba(255,228,200,0)'); g.addColorStop(1,'rgba(255,228,200,.35)'); ctx.fillStyle=g; ctx.fillRect(0,bb-50,w,80);
    // palms
    palms.forEach(p=>{ const px=p.x, base=bb+30, top=base-120*p.s; ctx.strokeStyle='#5E3A26'; ctx.lineWidth=4*p.s; ctx.beginPath(); ctx.moveTo(px,base); ctx.quadraticCurveTo(px+10*p.s,base-60*p.s,px+4*p.s,top); ctx.stroke();
      ctx.fillStyle='#5E3A26'; for(let k=0;k<7;k++){ const a=-Math.PI/2+(k-3)*.5+Math.sin(T*.8+p.ph+k)*.04; ctx.beginPath(); ctx.moveTo(px+4*p.s,top); ctx.quadraticCurveTo(px+4*p.s+Math.cos(a)*40*p.s,top+Math.sin(a)*22*p.s-10*p.s,px+4*p.s+Math.cos(a)*62*p.s,top+Math.sin(a)*30*p.s+18*p.s); ctx.quadraticCurveTo(px+4*p.s+Math.cos(a)*36*p.s,top+Math.sin(a)*18*p.s,px+4*p.s,top+3); ctx.fill(); } });
    // front rooftops with solar panels that catch the light
    const fb=h*.97; const sweep=((T*.18)%1.6)-.3;
    houses.forEach(o=>{ const y=fb-o.bh; ctx.fillStyle='#4A2C1C'; ctx.beginPath(); if(o.peak){ctx.moveTo(o.x-4,y+16);ctx.lineTo(o.x+o.bw/2,y);ctx.lineTo(o.x+o.bw+4,y+16);}else{ctx.moveTo(o.x,y+2);ctx.lineTo(o.x+o.bw,y);} ctx.lineTo(o.x+o.bw,h);ctx.lineTo(o.x,h);ctx.closePath();ctx.fill();
      ctx.fillStyle='#3A2216'; ctx.fillRect(o.x+o.bw*.2,y+(o.peak?20:10),o.bw*.16,o.bh*.35);
      if(o.panels){ const pw=(o.bw/2-10)/o.pn; for(let k=0;k<o.pn;k++){ const x0=o.peak?o.x+6+k*pw:o.x+8+k*pw*1.6, y0=o.peak?y+16-(k+1)*(16/(o.bw/2))*pw:y-6; const px=x0, py=o.peak?y+16-((x0-o.x+4)/(o.bw/2+4))*16-5:y-7;
        ctx.save(); ctx.translate(px,py); if(o.peak) ctx.transform(1,-16/(o.bw/2+4),0,1,0,0); ctx.fillStyle='#1F2A3A'; ctx.fillRect(0,0,pw-3,5);
        const kx=(o.x+k*pw)/w; const hl=Math.max(0,1-Math.abs(kx-sweep)*7)*ease; if(hl>0){ ctx.fillStyle=`rgba(255,236,180,${(hl*.95).toFixed(3)})`; ctx.fillRect(0,0,pw-3,5); } ctx.restore(); } } });
    // power lines with a pulse of current
    const ph=h*.74; ctx.lineWidth=1.2;
    poles.forEach((x,i)=>{ ctx.strokeStyle='#2E1B11'; ctx.lineWidth=5; ctx.beginPath(); ctx.moveTo(x,h); ctx.lineTo(x,ph); ctx.stroke(); ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(x-26,ph+10); ctx.lineTo(x+26,ph+10); ctx.stroke(); });
    for(let wi=0;wi<3;wi++){ const oy=ph+10+wi*0, ox=-22+wi*22;
      for(let i=0;i<poles.length-1;i++){ const x1=poles[i]+ox, x2=poles[i+1]+ox, sag=26+wi*4; ctx.strokeStyle='rgba(46,27,17,.85)'; ctx.lineWidth=1.3; ctx.beginPath(); ctx.moveTo(x1,oy); ctx.quadraticCurveTo((x1+x2)/2,oy+sag*2,x2,oy); ctx.stroke();
        if(!reduce){ const p=((T*.35+i*.37+wi*.21)%1); const bx=(1-p)*(1-p)*x1+2*(1-p)*p*((x1+x2)/2)+p*p*x2, by=(1-p)*(1-p)*oy+2*(1-p)*p*(oy+sag*2)+p*p*oy;
          g=ctx.createRadialGradient(bx,by,0,bx,by,16); g.addColorStop(0,'rgba(255,214,90,.95)'); g.addColorStop(.3,'rgba(255,160,40,.5)'); g.addColorStop(1,'rgba(255,140,30,0)'); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(bx,by,16,0,7); ctx.fill(); } } }
    // birds
    ctx.strokeStyle='rgba(70,40,25,.6)'; ctx.lineWidth=1.4;
    birds.forEach(b=>{ const bx=(b.x+T*20*b.v)%(w+60)-30, by=h*b.y+Math.sin(T+b.ph)*4, f=Math.sin(T*6+b.ph)*3*b.s; ctx.beginPath(); ctx.moveTo(bx-7*b.s,by-f); ctx.quadraticCurveTo(bx-3*b.s,by-2,bx,by); ctx.quadraticCurveTo(bx+3*b.s,by-2,bx+7*b.s,by-f); ctx.stroke(); });
    if(!reduce&&document.getElementById('dawnCanvas')===cv) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  const nav=document.getElementById('lnav'), hero=document.querySelector('.hero.dawn');
  const onScroll=()=>{ if(!document.getElementById('lnav')){ removeEventListener('scroll',onScroll); return; } nav.classList.toggle('dark',scrollY>hero.offsetHeight-90); };
  addEventListener('scroll',onScroll,{passive:true}); onScroll();
  const io='IntersectionObserver' in window?new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target);} }),{threshold:.3}):null;
  document.querySelectorAll('.kin').forEach(el=>io?io.observe(el):el.classList.add('in'));
}

function ttShow(el){ TT.innerHTML=el.dataset.tt; TT.classList.add('on'); const r=el.getBoundingClientRect(), w=TT.offsetWidth, h=TT.offsetHeight;
  let x=r.left+r.width/2-w/2, y=r.top-h-8; if(y<6) y=r.bottom+8; x=Math.max(6,Math.min(innerWidth-w-6,x)); TT.style.transform=`translate(${Math.round(x)}px,${Math.round(y)}px)`; }

const LOG_FIRST='2026-08-10', LOG_LAST='2026-10-06', TODAY='2026-10-07';

function dayKwh(key){ // a saved entry wins; otherwise the sample history
  if(S.log[key]) return S.log[key].reduce((s,e)=>{const a=S.apps.find(x=>x.id===e.id); return a?s+a.w*a.q*e.h*DF[a.cat]/1000:s;},0);

  const prev=m0===0?ymd(y-1,11,1):ymd(y,m0-1,1), next=m0===11?ymd(y+1,0,1):ymd(y,m0+1,1);

const LUC_OUTLINE=[[14.022,121.598],[14.013,121.636],[13.992,121.672],[13.968,121.700],[13.944,121.694],[13.924,121.679],[13.905,121.661],[13.893,121.636],[13.896,121.609],[13.904,121.588],[13.924,121.573],[13.955,121.570],[13.992,121.580]];
const BSEED={'Barangay 1':[13.9418,121.6075],'Barangay 2':[13.9418,121.6112],'Barangay 3':[13.9418,121.6149],'Barangay 4':[13.9418,121.6186],'Barangay 5':[13.9380,121.6075],'Barangay 6':[13.9380,121.6112],'Barangay 7':[13.9380,121.6149],'Barangay 8':[13.9380,121.6186],'Barangay 9':[13.9342,121.6075],'Barangay 10':[13.9342,121.6112],'Barangay 11':[13.9342,121.6149],'Market View':[13.9342,121.6186],
  'Isabang':[13.955,121.583],'Domoit':[13.970,121.593],'Bocohan':[13.986,121.604],'Ilayang Dupay':[14.000,121.628],'Gulang-Gulang':[13.948,121.597],'Ibabang Dupay':[13.956,121.630],'Ilayang Iyam':[13.970,121.650],'Ibabang Iyam':[13.945,121.640],'Mayao Kanluran':[13.957,121.661],'Mayao Parada':[13.977,121.674],'Mayao Crossing':[13.946,121.664],'Mayao Silangan':[13.957,121.688],'Mayao Castillo':[13.934,121.679],'Ilayang Talim':[13.926,121.663],'Ibabang Talim':[13.912,121.651],'Ransohan':[13.924,121.640],'Salinas':[13.906,121.637],'Dalahican':[13.903,121.619],'Cotta':[13.918,121.623],'Talao-Talao':[13.926,121.606],'Barra':[13.912,121.597]};
const BSHAPES=(()=>{ // Voronoi cells of the seeds, clipped to the city outline
  const cx=Math.cos(13.94*Math.PI/180), P=([la,ln])=>[ln*cx,la], U=([x,y])=>[y,x/cx];
  const clip=(poly,a,b)=>{ const n=[b[0]-a[0],b[1]-a[1]], m=[(a[0]+b[0])/2,(a[1]+b[1])/2], side=p=>(p[0]-m[0])*n[0]+(p[1]-m[1])*n[1], out=[];
    for(let i=0;i<poly.length;i++){ const p=poly[i], q=poly[(i+1)%poly.length], sp=side(p), sq=side(q);
      if(sp<=0) out.push(p); if((sp<0&&sq>0)||(sp>0&&sq<0)){ const t=sp/(sp-sq); out.push([p[0]+t*(q[0]-p[0]),p[1]+t*(q[1]-p[1])]); } } return out; };
  const names=Object.keys(BSEED), pts=names.map(n=>P(BSEED[n])), out={};
  names.forEach((n,i)=>{ let poly=LUC_OUTLINE.map(P); pts.forEach((q,j)=>{ if(j!==i) poly=clip(poly,pts[i],q); });
    let A=0; for(let k=0;k<poly.length;k++){ const p=poly[k],q=poly[(k+1)%poly.length]; A+=p[0]*q[1]-q[0]*p[1]; }
    out[n]={ll:poly.map(U),area:Math.abs(A)/2}; });
  return out; })();

}
function bInfo(name){ const b=BRGY.find(x=>x.name===name), m=brgyMetrics(b), e=m.sup?brgyEstimate(b):null, api=m.sup?e.api:m.api;
  return {b,m,e,api,tt:m.sup?`<b>${esc(name)}</b><br>Insufficient data (fewer than 5 households)<br><span class="ttw">Model estimate: index ${e.api.toFixed(0)}</span><br>${fmt.n(b.Nres)} households`:`<b>${esc(name)}</b><br>Index <b>${m.api.toFixed(0)}</b> · ${priority(m.api)} priority<br>Viable ${(m.v*100).toFixed(0)}% · uptake ${(m.u*100).toFixed(0)}%<br>${m.n} checked of ${fmt.n(b.Nres)} households`}; }
function mountMap(){
  const el=document.getElementById('lmap'); if(!el||!window.L) return;
  const mode=el.dataset.mode, light=document.documentElement.dataset.theme==='light';
  const map=L.map(el,{zoomSnap:0.25,zoomDelta:0.5,wheelPxPerZoomLevel:120,minZoom:11,maxZoom:17,attributionControl:true});
  const tiles=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
  tiles.on('tileerror',()=>el.classList.add('notiles'));
  const bounds=L.latLngBounds(LUC_OUTLINE);
  if(S.mapView) map.setView(S.mapView.c,S.mapView.z); else map.fitBounds(bounds,{padding:[6,6]});
  const gapHit=m=>!m.sup&&m.v>=0.6&&m.u<=0.16;
  const layers=[];
  Object.entries(BSHAPES).forEach(([name,s])=>{ const I=bInfo(name), m=I.m;
    let style;
    if(mode==='gap'){ const hit=gapHit(m); style={color:hit?'#B45309':'#8a7a6a',weight:hit?2:1,fillColor:hit?'#FF9F1C':'#9a8a7a',fillOpacity:hit?.7:.15,dashArray:m.sup?'4 4':null}; }
    else style=m.sup?{color:'#C9A227',weight:1.4,dashArray:'5 4',fillColor:apiColor(I.api),fillOpacity:.28}:{color:light?'#fff':'#1a120a',weight:1.2,fillColor:apiColor(I.api),fillOpacity:.78};
    const poly=L.polygon(s.ll,style).addTo(map);
    poly.bindTooltip(I.tt,{sticky:true,className:'ltt',direction:'top',offset:[0,-6]});
    const lbl=L.tooltip({permanent:true,direction:'center',className:'blabel',interactive:false}).setLatLng(L.latLng(BSEED[name])).setContent(esc(name.replace('Barangay ','Brgy ')));
    poly.on('mouseover',()=>poly.setStyle({weight:3,color:'#FFD84D'})); poly.on('mouseout',()=>poly.setStyle({weight:style.weight,color:style.color}));
    poly.on('click',()=>ACT.gSel(name));
    if(S.gSel===name&&mode!=='gap') poly.setStyle({weight:3,color:'#FFD84D'});
    layers.push({lbl,area:s.area,on:false}); });
  const labels=()=>{ const z=map.getZoom(), k=Math.pow(256*Math.pow(2,z)/360,2);
    layers.forEach(o=>{ const show=o.area*k>5200; if(show&&!o.on){ o.lbl.addTo(map); o.on=true; } else if(!show&&o.on){ map.removeLayer(o.lbl); o.on=false; } }); };
  map.on('zoomend',labels); labels();
  map.on('moveend',()=>{ S.mapView={c:map.getCenter(),z:map.getZoom()}; });
}

function brgyUse(b,i){ const r=rng(5000+i*31), off=(r()-0.5)*0.16;
  const hh=b.hh.map(h=>({...h,al:Math.max(0.2,Math.min(0.75,0.30+0.35*(1-h.cool)+off+(r()-0.5)*0.12))}));
  const n=hh.length, avg=k=>hh.reduce((s,h)=>s+h[k],0)/(n||1);
  const bands=[0,0,0,0]; hh.forEach(h=>bands[h.kwh<150?0:h.kwh<300?1:h.kwh<500?2:3]++);
  return {n,kwh:avg('kwh'),cool:avg('cool'),al:avg('al'),bands}; }
function program(m,u){ if(m.sup) return ['info','Info drive','Fewer than 5 checked households. Get more data first.'];
  if(m.v<0.4) return ['eff','Efficiency first','Solar pays back slowly here for most homes.'];
  if(u.cool>=0.5&&u.al<0.48) return ['eff','Efficiency first','Mostly night-time cooling. Inverter aircon saves more than panels.'];
  return ['solar','Solar program',u.al>=0.48?'Most power is used by day, while panels produce.':'Solar pays back well for most homes.']; }
vGDemand=function(){
  const rows=BRGY.map((b,i)=>{ const m=brgyMetrics(b), u=brgyUse(b,i); return {b,m,u,p:program(m,u)}; });
  const cnt=k=>rows.filter(r=>r.p[0]===k).length;
  const all=BRGY.filter(b=>b.hh.length>=5).flatMap(b=>b.hh);
  const bands=[['Low',0],['Medium',0],['High',0],['Very high',0]]; all.forEach(h=>{bands[h.kwh<150?0:h.kwh<300?1:h.kwh<500?2:3][1]++;});
  const cool=all.filter(h=>h.cool>=.4).length;
  const order={solar:0,eff:1,info:2}; rows.sort((a,b)=>order[a.p[0]]-order[b.p[0]]||(b.m.api||0)-(a.m.api||0));
  const PCOL={solar:'hot',eff:'warn',info:'dash'};
  const mix=bs=>{ const t=bs.reduce((a,b)=>a+b,0)||1; return `<div class="mixbar" data-tt="${esc(`Low ${bs[0]} · Medium ${bs[1]} · High ${bs[2]} · Very high ${bs[3]}`)}">${bs.map((v,j)=>`<i style="width:${v/t*100}%;background:${['#FFE7A8','#FFC83D','#FF9F1C','#FF5A1F'][j]}"></i>`).join('')}</div>`; };
  return pageHead('What kind of help each area needs','How homes in each barangay use electricity, and the program that would help them most.')+
  `<div class="grid g3">${[['solar','Solar program','Homes use power while the sun is up and solar pays back well. Push solar loans and installer listings.'],['eff','Efficiency first','Mostly night-time cooling or slow payback. Start with inverter-aircon and appliance programs.'],['info','Info drive','Not enough checked households yet. Run an info drive so residents check a bill.']].map(([k,t,s])=>`<div class="card kpi ${k==='solar'?'card-hot':''}"><div class="label">${t}</div><div class="value num">${cnt(k)} <span style="font-size:15px" class="muted">barangays</span></div><div class="sub">${s}</div></div>`).join('')}</div>
  <div class="card"><div class="card-head"><h3>Suggested program per barangay ${cinfo('dem-program')}</h3><div class="legend"><span><i style="background:#FFE7A8"></i>Low</span><span><i style="background:#FFC83D"></i>Medium</span><span><i style="background:#FF9F1C"></i>High</span><span><i style="background:#FF5A1F"></i>Very high use</span></div></div>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Barangay</th><th class="r">Households</th><th class="r">Avg use</th><th class="r">Cooling</th><th class="r">Used by day ${info('Share of power used between 6 am and 6 pm, from the appliances and hours households entered (SRS D.4, α). Solar covers daytime use directly.')}</th><th style="min-width:120px">Usage mix</th><th>Suggested program</th></tr></thead><tbody>
    ${rows.map(({b,m,u,p})=>m.sup?`<tr class="click" data-act="gSel" data-arg="${esc(b.name)}"><td>${esc(b.name)}</td><td class="r">${m.n?'&lt; 5':'0'}</td><td class="r muted" colspan="4">Not shown below 5 households (k = 5)</td><td><span class="chip dash">${p[1]}</span><div class="xs muted">${p[2]}</div></td></tr>`
      :`<tr class="click" data-act="gSel" data-arg="${esc(b.name)}"><td>${esc(b.name)}</td><td class="r">${m.n}</td><td class="r">${fmt.n(u.kwh,0)} kWh</td><td class="r">${Math.round(u.cool*100)}%</td><td class="r"><b>${Math.round(u.al*100)}%</b></td><td>${mix(u.bands)}</td><td><span class="chip ${PCOL[p[0]]}">${p[1]}</span><div class="xs muted">${p[2]}</div></td></tr>`).join('')}</tbody></table></div>
    <p class="xs muted" style="margin-top:10px">Rule: Info drive when fewer than 5 households. Efficiency first when under 40% of homes have a payback within 7 years, or when cooling is at least 50% of use and less than 48% is used by day. Otherwise Solar program. Sample data.</p></div>
  <div class="grid g2"><div class="card"><h3>Households by consumption band ${cinfo('dem-bands')}</h3>${barChart(bands.map(b=>b[1]),bands.map(b=>b[0]),{h:210,fmtY:v=>Math.round(v),ariaLabel:'Households by consumption band'})}</div>

const _vGScenarioV4=vGScenario;
vGScenario=function(){ let html=_vGScenarioV4();
  const sc=S.scen, list=sc.sel==='All shown barangays'?BRGY.filter(b=>b.hh.length>=5):[BRGY.find(b=>b.name===sc.sel)];
  const run=(a,pb)=>{ const keep=K.PB_VIABLE; K.PB_VIABLE=pb; const r=scenario(list,sc.s,a,sc.T); K.PB_VIABLE=keep; return r; };
  const cases=[['Low',run(sc.a*0.5,6),'adoption rate × 0.5, payback limit 6 yr'],['Likely',run(sc.a,7),'your inputs, payback limit 7 yr'],['High',run(sc.a*1.5,8),'adoption rate × 1.5, payback limit 8 yr']];
  const range=`<div class="card"><div class="card-head"><h3>Range, because the inputs are assumptions</h3><span class="tag t-assume">Estimate</span></div>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Case</th><th class="r">Extra adopters</th><th class="r">Extra kW</th><th class="r">Program cost</th><th class="r">Per additional kW</th></tr></thead><tbody>${cases.map(([l,r,s])=>`<tr><td><b>${l}</b><div class="xs muted">${s}</div></td><td class="r">${r.addA.toFixed(1)}</td><td class="r">${r.addKw.toFixed(1)}</td><td class="r">${fmt.peso(r.cost)}</td><td class="r"><b>${r.perAdd?fmt.peso(r.perAdd):'—'}</b></td></tr>`).join('')}</tbody></table></div>
    <div class="assume"><b class="small">Assumptions in this estimate</b><ul class="xs muted"><li><b>Adoption rate</b> (${(sc.a*100).toFixed(0)}% a year): no local data yet. It will be calibrated from real Silangan uptake.</li><li><b>Payback limit</b> (7 years): homes with a shorter payback are counted as likely to install.</li><li><b>Installed cost</b> ₱48,000 per kW plus ₱20,000 fixed: market sample, to be verified with Lucena installers (TBD-7, TBD-8).</li><li>The subsidy is paid to every adopter, including those who would install anyway.</li></ul></div></div>`;
  html=html.replace('<h3>Inputs</h3>',`<h3>Inputs ${cinfo('scen-in')}</h3>`).replace(/(<div class="label">Cost per additional kW )/,`$1${cinfo('scen-out')} `);
  const i=html.indexOf('<div class="card"><div class="card-head"><h3>Saved scenarios</h3>');
  return i>0?html.slice(0,i)+range+html.slice(i):html.replace(/<\/div><\/div><\/div>\s*$/,'</div></div></div>'+range);
};

/* ----- 1. Ways to save: a 4th status, "Not for me", with an optional reason and a Hidden tips list ----- */
S.noReason=S.noReason||{};
const NO_REASONS=[['cost','Too expensive'],['home','Not possible at home'],['already','Already doing it'],['nope','Just not interested']];
vEff=function(){
  const all=effActionsV4(), h=H(), st=id=>S.adopted[id]===true?'done':S.adopted[id]||'';
  const acts=all.filter(a=>st(a.id)!=='no'), hidden=all.filter(a=>st(a.id)==='no');
  const done=acts.filter(a=>st(a.id)==='done'), plan=acts.filter(a=>st(a.id)==='plan'), ticked=[...done,...plan];
  const sum=l=>l.reduce((s,a)=>s+a.kwh,0); const sAll=sum(ticked), sDone=sum(done);
  const now=h.sz.rec, f=h.f, after=E=>sizing(E,S.roof.usable,f).rec;
  const rDone=after(h.Eyear-sDone), rAll=after(h.Eyear-sAll);
  const upCost=ticked.filter(a=>a.cost&&!a.aiPrice).reduce((s,a)=>s+a.cost,0), aiCost=ticked.some(a=>a.aiPrice&&a.cost);
  const Y=(K.PSH*365*f*K.PR);
  const effect=()=>{ if(!now) return `<div class="value num" style="font-size:20px">Solar not sized yet</div><div class="sub">Validate a bill to see this.</div>`;
    if(!ticked.length) return `<div class="value num" style="font-size:22px">${now.N} panels now</div><div class="sub">Tick actions below to see how your system size changes.</div>`;
    const d=rAll?now.N-rAll.N:0;
    return `<div class="value num" style="font-size:22px">${d>0?`${now.N} → ${rAll.N} panels`:'Same system size'}</div><div class="sub">${d>0?`${fmt.peso(now.I-rAll.I)} less for solar${upCost?`, but the upgrades cost ${fmt.peso(upCost)}`:''}`:`Your use drops, but not enough to remove a whole panel. Your bill coverage goes up instead.`}</div>`; };
  const reasonOf=id=>(NO_REASONS.find(r=>r[0]===S.noReason[id])||[])[1];
  return pageHead('Ways to save electricity','Cheaper than any panel. Simple changes at home, ranked by how many pesos they save you each year.','',"Makatipid muna bago mag-solar. / Save first, then go solar.")+
  `<div class="card ai-note"><div class="row" style="gap:10px;flex-wrap:nowrap">${ic('spark',18)}<p class="small">${S.aiOffline?'<b>Helios is offline.</b> Showing the basic tips. Every number still works.':'<b>Tips are picked by Helios from your own appliances.</b> The savings, costs and payback are always computed by the calculator (SRS D.15), never by the AI.'}</p></div></div>
  <div class="grid g3"><div class="card card-hot kpi"><div class="label">If you do everything ticked</div><div class="value num">${fmt.n(sAll,0)} kWh/yr</div><div class="sub">${fmt.peso(sAll*K.R_RETAIL)} a year</div></div><div class="card kpi"><div class="label">Your monthly use would become</div><div class="value num">${fmt.n(h.bill-sAll/12,0)} kWh</div><div class="sub">from ${fmt.n(h.bill)} kWh</div></div><div class="card kpi"><div class="label">Effect on solar</div>${effect()}</div></div>
  <div class="card"><div class="tbl-wrap"><table class="tbl efftbl"><thead><tr><th>#</th><th>Action</th><th class="r">kWh/yr</th><th class="r">₱/yr</th><th class="r">Cost</th><th class="r">Payback</th><th>Status</th></tr></thead><tbody>${acts.map((a,i)=>`<tr><td class="num">${i+1}</td><td><div class="row" style="flex-wrap:nowrap;gap:10px;align-items:flex-start"><span style="color:var(--sun)">${ic(a.ic,18)}</span><div>${a.t}<div class="xs muted" style="margin-top:3px">${a.by==='ai'?`<span class="tag t-ai">${ic('spark',10)} AI suggested</span>`:'<span class="tag">Basic tip</span>'} · ${a.type}</div></div></div></td><td class="r">${fmt.n(a.kwh,0)}</td><td class="r"><b>${fmt.peso(a.php)}</b></td><td class="r">${a.cost?fmt.peso(a.cost):'Free'}${a.src?`<div class="xs ${a.aiPrice?'warnt':'muted'}">${a.src}</div>`:''}</td><td class="r">${a.cost?a.pb.toFixed(1)+' yr':'Now'}</td><td><div class="seg sm adopt">${[['','Not yet'],['plan','Planning'],['done','Done']].map(([k,l])=>`<button class="${st(a.id)===k?'on':''}" data-act="adoptSet" data-arg="${a.id}:${k}" aria-pressed="${st(a.id)===k}">${l}</button>`).join('')}</div><button class="linkbtn nofor" data-act="noFor" data-arg="${a.id}">${ic('eyeOff',13)} Not for me</button></td></tr>`).join('')||`<tr><td colspan="7" class="small muted">You've hidden every tip. Restore one below.</td></tr>`}</tbody></table></div>
  <p class="xs faint" style="margin-top:10px">Inverter aircon: 750 W × 2 × 8 h × (0.80 − 0.60) = 2.4 kWh/day = 876 kWh/yr = ₱12,914/yr (SRS D.15). Prices come from the admin price list with their source; an AI estimate is labelled and never counted in totals.</p></div>
  ${hidden.length?`<details class="card hidtips" ${S.hidOpen?'open':''}><summary data-act="hidOpen">${ic('eyeOff',15)} <b>Hidden tips (${hidden.length})</b><span class="xs muted">Not counted in your totals. Helios won't suggest these again.</span></summary>
    <div class="stack" style="margin-top:12px">${hidden.map(a=>`<div class="hidrow"><span style="color:var(--muted)">${ic(a.ic,17)}</span><div style="flex:1;min-width:0"><span class="small">${a.t}</span><div class="xs muted" style="margin-top:2px">${reasonOf(a.id)?`<span class="chip">${S.noReason[a.id]==='already'?ic('check2',11)+' ':''}${reasonOf(a.id)}</span> `:''}${S.noReason[a.id]==='already'?'Already in your bill, so it is never counted twice.':`Would save ${fmt.peso(a.php)} a year`}</div></div><button class="btn btn-sm btn-ghost" data-act="adoptSet" data-arg="${a.id}:">${ic('restore',14)} Restore</button></div>`).join('')}</div>
    <p class="xs faint" style="margin-top:10px">If you allowed barangay statistics, your reasons are counted anonymously (never for fewer than 5 households). "Too expensive" answers help the city plan rebate programs.</p></details>`:''}
  ${now&&ticked.length?`<details class="card"><summary class="small" style="cursor:pointer;color:var(--amber)">How we computed the effect on solar</summary><div class="calc" style="margin-top:10px">Your yearly use now                 ${fmt.n(h.Eyear,0)} kWh
Savings you ticked                  −${fmt.n(sAll,0)} kWh   (already done: ${fmt.n(sDone,0)} kWh)
Yearly use after saving              ${fmt.n(h.Eyear-sAll,0)} kWh
Yield per kWp  Y = ${K.PSH.toFixed(4)} × 365 × ${f.toFixed(3)} × ${K.PR.toFixed(4)} = ${fmt.n(Y,1)} kWh/kWp
Panels = largest N with N × ${(K.P_PANEL/1000).toFixed(2)} kWp × Y ≤ yearly use (SRS D.3.5)
       = ${rAll?rAll.N:0} panels (now ${now.N}) · ${rAll?rAll.kwp.toFixed(2):'0'} kWp (now ${now.kwp.toFixed(2)})
Solar price    ${rAll?fmt.peso(rAll.I):'–'} (now ${fmt.peso(now.I)})
Upgrade cost   ${fmt.peso(upCost)}${aiCost?'  (+ items with an AI estimate, not counted)':''}</div>
    <p class="small" style="margin-top:10px">${ic('info',13)} We size your solar only on what's <b>already done</b>: ${rDone?`${rDone.N} panels (${rDone.kwp.toFixed(2)} kWp)`:'–'}. Things you're <b>planning to</b> do show as "could need". Re-check after 2 to 3 bills, so your system is sized on your real new bills, not on promises.</p></details>`:''}`;
};

    const txt=el.textContent, m=txt.match(/^([^\d]*?)([\d,]*\.?\d+)(.*)$/s); if(!m) return;
    const pre=m[1], raw=m[2], suf=m[3], dec=(raw.split('.')[1]||'').length, target=parseFloat(raw.replace(/,/g,'')), comma=raw.includes(',');
    if(!isFinite(target)||target===0) return;
    const fmtN=v=>{ let s=v.toFixed(dec); if(comma){ const [a,b]=s.split('.'); s=a.replace(/\B(?=(\d{3})+(?!\d))/g,',')+(b?'.'+b:''); } return pre+s+suf; };
    const t0=performance.now(), dur=1500; el.textContent=fmtN(0);
    (function step(t){ const k=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-k,4); el.textContent=fmtN(target*e); if(k<1) requestAnimationFrame(step); else el.textContent=txt; })(t0);

  }

    if(d.dataset.mvFaq) return; d.dataset.mvFaq='1'; const s=d.querySelector('summary'); if(!s) return;

      else { d.open=true; const end=d.offsetHeight; d.animate([{height:start+'px'},{height:end+'px'}],{duration:480,easing:'cubic-bezier(.16,1,.3,1)'}); const p=d.querySelector('p'); p&&p.animate([{opacity:0,transform:'translateY(-6px)'},{opacity:1,transform:'none'}],{duration:420,easing:'ease-out'}); } });

      const key=sec.id||('sec'+si); sec.dataset.mvKey=key;
      const items=[...sec.querySelectorAll(':scope>.eyebrow, :scope>h2, :scope>.su-sub, :scope>p, :scope>.su-toggle, :scope>.row, .su-feat .su-ftxt, .su-feat .su-viz, .pipe .tile, .su-how, .su-stat, .su-target, .su-sdg, .su-bar3, .su-plan, .su-cmp, details, .card')]

  const T={on:false,mode:'full',i:0,list:[],adv:false,moreOpen:false,menu:false,gloss:false,min:false,pos:null,lastKey:''};
  const GLOSS=[['kWh (kilowatt-hour)','The unit on your Meralco bill. A 1,000-watt appliance running for 1 hour uses 1 kWh.'],['Watts (W)','How much power an appliance draws while it is on. Printed on its label.'],['Duty factor','How much of the time a motor really runs. An aircon compressor switches on and off, so it counts 0.60 to 0.80 of its hours.'],['Meralco rate','₱14.7424 per kWh, Meralco\'s residential rate for September 2026.'],['Bill match score','0 to 100. How close our appliance estimate is to your real bill. 60 or more unlocks solar; 80 or more is High.'],['kWp (kilowatt-peak)','The size of a solar system: the panel ratings added up. 6 × 550 W = 3.30 kWp.'],['Coverage','The share of your yearly use that the panels make.'],['Performance ratio','What is left of the sun\'s energy after heat, wiring and inverter losses. 0.76 here.'],['Payback','Years until your savings equal what you paid for the system.'],['NPV (net present value)','25 years of savings minus the cost, in today\'s pesos.'],['Net metering','Meralco\'s program (RA 9513) where solar you send to the grid earns a credit on your bill.'],['Generation charge','The part of the rate credited for exported solar: ₱9.7032 per kWh.'],['PI (performance index)','Actual output ÷ expected output for the weather. Below 0.80 for 2 months raises an alert.'],['Open-Meteo','A free weather service with satellite sunshine data for Lucena.'],['Validated household','A home whose bill check passed.'],['API (adoption potential index)','0 to 100 per barangay: 100 × viable share × (1 − uptake). High = many homes would benefit and few have solar yet.'],['Viable share','The share of checked homes where solar pays back within 7 years.'],['k = 5','The smallest group the city can see. A barangay with fewer than 5 checked homes shows "Insufficient data".'],['MW (megawatt)','1,000 kW. Used for city-wide solar potential.']];

      :`<div class="tr-foot"><button class="btn btn-sm btn-ghost" data-tr="back" ${T.i===0?'disabled':''}>${ic('chevL',14)} Back</button><span class="tr-sp"></span>${need?`<button class="linkbtn xs" data-tr="next">Skip</button>`:''}<button class="btn btn-sm btn-primary ${done?'tr-glow':''}" data-tr="next" ${need?'disabled':''}>${need?'Do the step first':'Next'} ${need?'':ic('arrow',14)}</button></div>`}

  function target(){ const s=stepOf(T.i); if(!s.t) return null; if(s.r&&S.route!==s.r) return null; try{ const el=s.t(); return el&&el.getClientRects().length?el:null; }catch(e){ return null; } }

  function place(){
    if(!T.on) return; setHot(); const el=target(), vw=innerWidth, vh=innerHeight, mob=vw<760, s=stepOf(T.i);
    const wrong=s.r&&S.route!==s.r;
    box.classList.toggle('tr-mob',mob); document.body.classList.toggle('tr-pad',mob);
    if(!el){ ring.hidden=true; shade.hidden=false; box.style.left=box.style.top=''; box.classList.toggle('tr-center',!pinned());
      if(wrong&&!box.querySelector('.tr-away')) box.insertAdjacentHTML('afterbegin',`<div class="tr-away small">You left this step's page. <button class="btn btn-sm btn-primary" data-tr="return">Take me back</button></div>`);
      return; }
    box.classList.remove('tr-center'); shade.hidden=true; ring.hidden=false;
    const r=el.getBoundingClientRect(), p=s.pad||10;
    const x=Math.max(4,r.left-p), y=Math.max(4,r.top-p), w=Math.min(vw-8,r.right+p)-x, h=Math.min(vh-8,r.bottom+p)-y;
    Object.assign(ring.style,{transform:`translate(${x}px,${y}px)`,width:Math.max(0,w)+'px',height:Math.max(0,h)+'px'});
    if(mob){ box.style.left=box.style.top=''; return; }
    if(pinned()) return;
    const cw=box.offsetWidth||370, chh=box.offsetHeight||240, g=16; let L,Tp;
    if(r.right+g+cw<vw-8){ L=r.right+g; Tp=r.top; }
    else if(r.left-g-cw>8){ L=r.left-g-cw; Tp=r.top; }
    else if(r.bottom+g+chh<vh-8){ L=r.left+Math.min(r.width,vw)/2-cw/2; Tp=r.bottom+g; }
    else if(r.top-g-chh>8){ L=r.left+Math.min(r.width,vw)/2-cw/2; Tp=r.top-g-chh; }
    else { L=vw-cw-20; Tp=vh-chh-20; }
    L=Math.max(12,Math.min(vw-cw-12,L)); Tp=Math.max(12,Math.min(vh-chh-12,Tp));

  function scroller(el){ let p=el.parentElement; while(p&&p!==document.body&&p!==document.documentElement){ const o=getComputedStyle(p).overflowY; if(/(auto|scroll)/.test(o)&&p.scrollHeight>p.clientHeight+4) return p; p=p.parentElement; } return null; }
  function scrollToTarget(){ const el=target(); if(!el) return; if(el.classList.contains('drawer')) return;
    const r=el.getBoundingClientRect(), vh=innerHeight, mob=innerWidth<760, s=stepOf(T.i); let want;
    if(mob){ const avail=vh-(box.offsetHeight||300)-16, room=avail-70;

    else { if(r.top>=70&&r.bottom<=vh-20) return; want=r.height>vh*.62?90:(vh-r.height)/2; }

  }
  function show(k){
